<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dinosaur | Dino Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07110b;
    color: white;
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
}

/* NAV */

nav {
    height: 78px;
    width: 100%;
    padding: 0 5%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(5,15,9,0.85);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(160,195,145,0.15);

    position: fixed;
    top: 0;
    z-index: 100;
}

.logo {
    color: #dcebd4;
    text-decoration: none;

    font-family: 'Cinzel', serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 2px;
}

.back {
    color: #b8d1ad;
    text-decoration: none;

    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;

    transition: 0.3s;
}

.back:hover {
    color: white;
}


/* MAIN */

.dino-page {

    min-height: 100vh;

    padding: 130px 25px 80px;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}


/* BACKGROUND GLOW */

.dino-page::before {

    content: "";

    position: fixed;

    width: 600px;
    height: 600px;

    background: #245c35;

    filter: blur(180px);

    opacity: 0.18;

    top: 20%;
    left: 50%;

    transform: translateX(-50%);

    pointer-events: none;
}


/* PROFILE */

.profile {

    width: 1150px;
    max-width: 100%;

    display: grid;

    grid-template-columns: 1.1fr 1fr;

    background: #0d1911;

    border: 1px solid rgba(155,190,140,0.2);

    box-shadow:
        0 30px 100px rgba(0,0,0,0.5);

    overflow: hidden;

    position: relative;

    z-index: 2;

    animation: appear 0.7s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* IMAGE */

.image-container {

    min-height: 650px;

    position: relative;

    overflow: hidden;

    background: #111;
}

.dino-image {

    width: 100%;
    height: 100%;

    min-height: 650px;

    object-fit: cover;

    display: block;

    transition: transform 0.8s ease;
}

.image-container:hover .dino-image {

    transform: scale(1.04);

}


/* IMAGE OVERLAY */

.image-container::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            transparent 60%,
            #0d1911 100%
        );

    pointer-events: none;
}


/* INFO */

.info {

    padding: 65px;

    display: flex;

    flex-direction: column;

    justify-content: center;
}

.number {

    color: #8fb67e;

    font-size: 11px;

    letter-spacing: 4px;

    margin-bottom: 15px;
}

h1 {

    font-family: 'Cinzel', serif;

    font-size: clamp(40px, 5vw, 65px);

    line-height: 1.05;

    margin: 0 0 15px;

    color: #e1ebdd;
}

.period {

    color: #9fc18f;

    font-size: 13px;

    letter-spacing: 2px;

    margin-bottom: 35px;
}


/* STATS */

.stats {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 30px;
}

.stat {

    padding: 17px;

    background: rgba(255,255,255,0.035);

    border: 1px solid rgba(255,255,255,0.07);
}

.label {

    display: block;

    color: #71816f;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-bottom: 7px;
}

.value {

    color: #d7e5d2;

    font-size: 14px;

    font-weight: 600;
}


/* FACT */

.fact {

    border-left: 2px solid #8fb67e;

    padding-left: 18px;

    color: #a6b5a1;

    font-size: 13px;

    line-height: 1.8;
}


/* FALLING DINOS */

.falling-dino {

    position: fixed;

    top: -70px;

    font-size: 43px;

    opacity: 0.35;

    pointer-events: none;

    z-index: 1;

    animation: fall linear infinite;
}

@keyframes fall {

    from {
        transform: translateY(-80px) rotate(0deg);
    }

    to {
        transform: translateY(110vh) rotate(360deg);
    }

}


/* ERROR */

.error {

    text-align: center;

    max-width: 600px;

    padding: 60px;

    background: #0d1911;

    border: 1px solid rgba(155,190,140,0.2);

    position: relative;

    z-index: 5;
}

.error h1 {

    font-size: 40px;

    margin-bottom: 15px;
}

.error p {

    color: #9cac99;

    line-height: 1.7;
}

.error a {

    display: inline-block;

    margin-top: 20px;

    padding: 13px 22px;

    background: #315f3c;

    color: white;

    text-decoration: none;

    border-radius: 5px;
}


/* MOBILE */

@media(max-width:850px) {

    .profile {

        grid-template-columns: 1fr;
    }

    .image-container {

        min-height: 400px;
    }

    .dino-image {

        min-height: 400px;
    }

    .info {

        padding: 40px 30px;
    }

}


@media(max-width:600px) {

    nav {

        height: 65px;

        padding: 0 20px;
    }

    .logo {

        font-size: 16px;
    }

    .back {

        font-size: 11px;
    }

    .stats {

        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- FALLING DINOSAURS -->

<div class="falling-dino"
     style="left:1%; animation-duration:8s;">
    🦖
</div>

<div class="falling-dino"
     style="left:5%; animation-duration:11s; animation-delay:3s;">
    🦕
</div>

<div class="falling-dino"
     style="right:1%; animation-duration:9s; animation-delay:1s;">
    🦖
</div>

<div class="falling-dino"
     style="right:5%; animation-duration:12s; animation-delay:4s;">
    🦕
</div>


<!-- NAVIGATION -->

<nav>

    <a href="index.html" class="logo">
        🦖 DINO EXPLORER
    </a>

    <a href="index.html" class="back">
        ← BACK TO EXPLORE
    </a>

</nav>


<!-- DINOSAUR -->

<main class="dino-page">

    <div id="dinoContainer"></div>

</main>


<script>

/* =================================
   DINOSAUR DATABASE
================================= */

const dinosaurs = {

    "trex": {

        number: "SPECIES 01",

        name: "Tyrannosaurus Rex",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/6/6f/Tyrannosaurus_Rex_Holotype.jpg",

        period: "LATE CRETACEOUS",

        diet: "Carnivore",

        length: "Around 12 m",

        feature: "Powerful jaws",

        type: "Theropod",

        fact:
        "T. rex was one of the most powerful land predators ever discovered. It had huge jaws, strong teeth and an enormous skull."
    },


    "triceratops": {

        number: "SPECIES 02",

        name: "Triceratops",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/4/44/Triceratops_BW.jpg",

        period: "LATE CRETACEOUS",

        diet: "Herbivore",

        length: "Around 9 m",

        feature: "Three horns",

        type: "Ceratopsian",

        fact:
        "Triceratops had a massive skull, a protective frill and three distinctive horns that may have helped with defense."
    },


    "velociraptor": {

        number: "SPECIES 03",

        name: "Velociraptor",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5e/Velociraptor_restoration.png",

        period: "LATE CRETACEOUS",

        diet: "Carnivore",

        length: "Around 2 m",

        feature: "Curved claw",

        type: "Dromaeosaur",

        fact:
        "Real Velociraptors were much smaller than their movie versions. Fossil evidence also indicates that they had feathers."
    },


    "spinosaurus": {

        number: "SPECIES 04",

        name: "Spinosaurus",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/e/e5/Spinosaurus_aegyptiacus.png",

        period: "CRETACEOUS",

        diet: "Carnivore",

        length: "Around 15 m",

        feature: "Large sail",

        type: "Theropod",

        fact:
        "Spinosaurus had a long narrow skull, a huge sail-like structure on its back and adaptations associated with living near water."
    },


    "stegosaurus": {

        number: "SPECIES 05",

        name: "Stegosaurus",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/7/7e/Stegosaurus_stenops.jpg",

        period: "LATE JURASSIC",

        diet: "Herbivore",

        length: "Around 9 m",

        feature: "Back plates",

        type: "Stegosaur",

        fact:
        "Stegosaurus is famous for the large plates along its back and the four spikes at the end of its tail."
    },


    "ankylosaurus": {

        number: "SPECIES 06",

        name: "Ankylosaurus",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/0/0f/Ankylosaurus_magniventris.jpg",

        period: "LATE CRETACEOUS",

        diet: "Herbivore",

        length: "Around 8 m",

        feature: "Tail club",

        type: "Ankylosaur",

        fact:
        "Ankylosaurus had heavy body armor and a powerful tail club that could be used as a defensive weapon."
    }

};


/* =================================
   GET DINOSAUR FROM URL
================================= */

const params = new URLSearchParams(window.location.search);

const dinosaurName = params.get("dino");


/* =================================
   SHOW DINOSAUR
================================= */

const container =
    document.getElementById("dinoContainer");


if (dinosaurs[dinosaurName]) {

    const dino = dinosaurs[dinosaurName];

    document.title =
        dino.name + " | Dino Explorer";


    container.innerHTML = `

        <article class="profile">

            <div class="image-container">

                <img
                    class="dino-image"
                    src="${dino.image}"
                    alt="${dino.name}"
                    onerror="this.src='https://via.placeholder.com/900x650/0d1911/9fc78c?text=Dinosaur+Image';"
                >

            </div>


            <div class="info">

                <div class="number">
                    ${dino.number}
                </div>


                <h1>
                    ${dino.name}
                </h1>


                <div class="period">
                    ${dino.period}
                </div>


                <div class="stats">


                    <div class="stat">

                        <span class="label">
                            Diet
                        </span>

                        <span class="value">
                            ${dino.diet}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="label">
                            Length
                        </span>

                        <span class="value">
                            ${dino.length}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="label">
                            Famous Feature
                        </span>

                        <span class="value">
                            ${dino.feature}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="label">
                            Type
                        </span>

                        <span class="value">
                            ${dino.type}
                        </span>

                    </div>

                </div>


                <div class="fact">

                    ${dino.fact}

                </div>

            </div>

        </article>

    `;

} else {

    container.innerHTML = `

        <div class="error">

            <h1>
                🦖 Dinosaur Not Found
            </h1>

            <p>
                Hmm... we couldn't find that dinosaur.
                Go back to the explorer and choose one from the archive.
            </p>

            <a href="index.html">
                ← Back to Dino Explorer
            </a>

        </div>

    `;

}

</script>

</body>

</html>
