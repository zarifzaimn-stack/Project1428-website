<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dinosaur Archive | Dino Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #07110b;
    color: white;
    font-family: 'Montserrat', sans-serif;
}

/* NAV */

nav {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 78px;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    background: rgba(5, 15, 9, 0.82);

    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(160, 195, 145, 0.15);
}

.logo {
    color: #dcebd4;

    text-decoration: none;

    font-family: 'Cinzel', serif;

    font-size: 22px;

    font-weight: 700;

    letter-spacing: 2px;
}

.back {
    color: #b8d1ad;

    text-decoration: none;

    font-size: 13px;

    font-weight: 600;

    letter-spacing: 1px;

    transition: 0.3s;
}

.back:hover {
    color: white;
}

/* HERO */

.hero {
    min-height: 430px;

    padding: 140px 25px 70px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            #193522,
            #07110b 70%
        );
}

.hero-content {
    max-width: 850px;
}

.hero-small {
    color: #9fc78c;

    font-size: 12px;

    letter-spacing: 5px;

    font-weight: 600;

    margin-bottom: 20px;
}

.hero h1 {
    font-family: 'Cinzel', serif;

    font-size: clamp(45px, 7vw, 80px);

    margin: 0;

    color: #e2eddd;

    letter-spacing: 2px;

    line-height: 1;
}

.hero p {
    max-width: 650px;

    margin: 25px auto 0;

    color: #91a393;

    line-height: 1.8;

    font-size: 15px;
}

/* ARCHIVE */

.archive {
    max-width: 1250px;

    margin: auto;

    padding: 70px 25px 120px;
}

/* SINGLE PROFILE */

.dino-profile {

    display: grid;

    grid-template-columns: 1.1fr 1fr;

    min-height: 570px;

    overflow: hidden;

    background: #0d1911;

    border: 1px solid rgba(155, 190, 140, 0.15);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35);

    animation: appear 0.7s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

/* IMAGE */

.dino-photo-box {

    width: 100%;

    min-height: 570px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px;

    background:
        radial-gradient(
            circle,
            #1b3522,
            #09140c 75%
        );
}

.dino-photo {

    width: 100%;

    height: 100%;

    max-height: 510px;

    object-fit: contain;

    object-position: center;

    display: block;

    filter:
        drop-shadow(
            0 18px 35px rgba(0,0,0,0.6)
        );

    transition: transform 0.6s ease;
}

.dino-photo:hover {
    transform: scale(1.04);
}

/* INFO */

.dino-info {

    padding: 55px;

    display: flex;

    flex-direction: column;

    justify-content: center;
}

.dino-number {

    color: #8fb67e;

    font-size: 11px;

    letter-spacing: 4px;

    margin-bottom: 12px;
}

.dino-info h2 {

    font-family: 'Cinzel', serif;

    font-size: clamp(32px, 4vw, 52px);

    line-height: 1.05;

    margin: 0 0 15px;

    color: #e1ebdd;
}

.period {

    color: #a5b5a0;

    font-size: 13px;

    letter-spacing: 1px;

    margin-bottom: 30px;
}

/* STATS */

.stats {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 30px;
}

.stat {

    padding: 16px;

    background: rgba(255,255,255,0.035);

    border: 1px solid rgba(255,255,255,0.07);
}

.stat-label {

    display: block;

    color: #71816f;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-bottom: 6px;
}

.stat-value {

    color: #d7e5d2;

    font-size: 14px;

    font-weight: 600;
}

/* FACT */

.fact {

    border-left: 2px solid #8fb67e;

    padding-left: 18px;

    color: #9cac99;

    font-size: 13px;

    line-height: 1.8;
}

/* ERROR */

.error {

    text-align: center;

    padding: 80px 20px;

    color: #9cac99;
}

.error h2 {

    font-family: 'Cinzel', serif;

    color: #dcebd4;

    font-size: 40px;
}

/* FALLING DINOS */

.falling-dino {

    position: fixed;

    top: -70px;

    font-size: 43px;

    z-index: 90;

    pointer-events: none;

    opacity: 0.4;

    animation: fall linear infinite;
}

@keyframes fall {

    from {
        transform:
            translateY(-80px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(360deg);
    }

}

/* FOOTER */

footer {

    padding: 35px;

    text-align: center;

    background: #040b06;

    color: #657664;

    font-size: 12px;

    letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 850px) {

    .dino-profile {

        grid-template-columns: 1fr;

    }

    .dino-photo-box {

        min-height: 400px;

        height: 400px;

    }

    .dino-photo {

        max-height: 360px;

    }

    .dino-info {

        padding: 35px 25px;

    }

}

@media (max-width: 600px) {

    nav {

        height: 65px;

        padding: 0 20px;

    }

    .logo {

        font-size: 18px;

    }

    .hero {

        min-height: 400px;

    }

    .stats {

        grid-template-columns: 1fr;

    }

    .dino-photo-box {

        min-height: 330px;

        height: 330px;

    }

    .dino-photo {

        max-height: 300px;

    }

}

</style>

</head>

<body>


<!-- FALLING DINOSAURS -->

<div class="falling-dino"
     style="left:1%; animation-duration:8s;">
    🦖
</div>

<div class="falling-dino"
     style="left:5%; animation-duration:11s; animation-delay:3s;">
    🦕
</div>

<div class="falling-dino"
     style="right:1%; animation-duration:9s; animation-delay:1s;">
    🦖
</div>

<div class="falling-dino"
     style="right:5%; animation-duration:12s; animation-delay:4s;">
    🦕
</div>


<!-- NAV -->

<nav>

    <a href="index.html" class="logo">
        🦖 DINO EXPLORER
    </a>

    <a href="index.html" class="back">
        ← BACK TO EXPLORE
    </a>

</nav>


<!-- HERO -->

<header class="hero">

    <div class="hero-content">

        <div class="hero-small">
            PREHISTORIC ARCHIVE
        </div>

        <h1 id="heroTitle">
            THE DINOSAURS
        </h1>

        <p id="heroDescription">
            Discover the creature that dominated Earth
            millions of years before us.
        </p>

    </div>

</header>


<!-- DINOSAUR -->

<main class="archive">

    <div id="dinoContainer"></div>

</main>


<footer>

    🦖 DINO EXPLORER

    <br><br>

    THE PREHISTORIC WORLD AWAITS.

</footer>


<script>

/* ==========================================
   DINOSAUR DATABASE
========================================== */

const dinosaurs = {

    trex: {

        number: "SPECIES 01",

        name: "Tyrannosaurus Rex",

        period: "LATE CRETACEOUS",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/6/6f/Tyrannosaurus_Rex_Holotype.jpg",

        diet: "Carnivore",

        length: "Around 12 m",

        feature: "Powerful bite",

        type: "Theropod",

        fact:
        "One of the most famous dinosaurs ever discovered, T. rex had enormous jaws, powerful teeth and a very strong bite."

    },

    triceratops: {

        number: "SPECIES 02",

        name: "Triceratops",

        period: "LATE CRETACEOUS",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/4/44/Triceratops_BW.jpg",

        diet: "Herbivore",

        length: "Around 9 m",

        feature: "Three horns",

        type: "Ceratopsian",

        fact:
        "Triceratops had a huge skull, a protective frill and three distinctive horns."

    },

    velociraptor: {

        number: "SPECIES 03",

        name: "Velociraptor",

        period: "LATE CRETACEOUS",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5e/Velociraptor_restoration.png",

        diet: "Carnivore",

        length: "Around 2 m",

        feature: "Curved claw",

        type: "Dromaeosaur",

        fact:
        "Real Velociraptors were much smaller than their movie versions and evidence indicates they had feathers."

    },

    spinosaurus: {

        number: "SPECIES 04",

        name: "Spinosaurus",

        period: "CRETACEOUS",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/e/e5/Spinosaurus_aegyptiacus.png",

        diet: "Carnivore",

        length: "Around 15 m",

        feature: "Large sail",

        type: "Theropod",

        fact:
        "Spinosaurus had a long narrow skull and a distinctive sail-like structure along its back."

    },

    stegosaurus: {

        number: "SPECIES 05",

        name: "Stegosaurus",

        period: "LATE JURASSIC",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/0/08/Stegosaurus_BW.jpg",

        diet: "Herbivore",

        length: "Around 9 m",

        feature: "Back plates",

        type: "Thyreophoran",

        fact:
        "Stegosaurus was famous for its large plates and the spikes on its tail."

    },

    brachiosaurus: {

        number: "SPECIES 06",

        name: "Brachiosaurus",

        period: "LATE JURASSIC",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/3/3b/Brachiosaurus_BW.jpg",

        diet: "Herbivore",

        length: "Around 23 m",

        feature: "Long neck",

        type: "Sauropod",

        fact:
        "Brachiosaurus had long front legs and a tall neck that helped it reach vegetation high above the ground."

    },

    ankylosaurus: {

        number: "SPECIES 07",

        name: "Ankylosaurus",

        period: "LATE CRETACEOUS",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5e/Ankylosaurus_dinosaur.png",

        diet: "Herbivore",

        length: "Around 8 m",

        feature: "Tail club",

        type: "Armored dinosaur",

        fact:
        "Ankylosaurus was heavily armored and had a powerful club-like tail for defense."

    },

    allosaurus: {

        number: "SPECIES 08",

        name: "Allosaurus",

        period: "LATE JURASSIC",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/b/b0/Allosaurus_BW.jpg",

        diet: "Carnivore",

        length: "Around 9 m",

        feature: "Sharp teeth",

        type: "Theropod",

        fact:
        "Allosaurus was one of the major predators of the Late Jurassic and had powerful jaws and sharp teeth."

    },

    diplodocus: {

        number: "SPECIES 09",

        name: "Diplodocus",

        period: "LATE JURASSIC",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5b/Diplodocus_carnegii.jpg",

        diet: "Herbivore",

        length: "Around 25 m",

        feature: "Whip-like tail",

        type: "Sauropod",

        fact:
        "Diplodocus had an extremely long neck and tail, making it one of the most recognizable sauropods."

    }

};


/* ==========================================
   GET DINOSAUR FROM URL
========================================== */

const params = new URLSearchParams(window.location.search);

const selectedDino = params.get("dino");


/* ==========================================
   DISPLAY ONLY SELECTED DINOSAUR
========================================== */

const container =
    document.getElementById("dinoContainer");

if (selectedDino && dinosaurs[selectedDino]) {

    const dino = dinosaurs[selectedDino];

    document.title =
        dino.name + " | Dino Explorer";

    document.getElementById("heroTitle").textContent =
        dino.name;

    document.getElementById("heroDescription").textContent =
        "Explore the world of this prehistoric giant.";

    container.innerHTML = `

        <article class="dino-profile">

            <div class="dino-photo-box">

                <img
                    class="dino-photo"
                    src="${dino.image}"
                    alt="${dino.name}"
                >

            </div>


            <div class="dino-info">

                <div class="dino-number">
                    ${dino.number}
                </div>

                <h2>
                    ${dino.name}
                </h2>

                <div class="period">
                    ${dino.period}
                </div>


                <div class="stats">

                    <div class="stat">

                        <span class="stat-label">
                            Diet
                        </span>

                        <span class="stat-value">
                            ${dino.diet}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="stat-label">
                            Length
                        </span>

                        <span class="stat-value">
                            ${dino.length}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="stat-label">
                            Feature
                        </span>

                        <span class="stat-value">
                            ${dino.feature}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="stat-label">
                            Type
                        </span>

                        <span class="stat-value">
                            ${dino.type}
                        </span>

                    </div>

                </div>


                <div class="fact">

                    ${dino.fact}

                </div>

            </div>

        </article>

    `;

} else {

    container.innerHTML = `

        <div class="error">

            <h2>
                🦖 Dinosaur Not Found
            </h2>

            <p>
                Choose a dinosaur from the Explore page.
            </p>

        </div>

    `;

}

</script>

</body>

</html>
