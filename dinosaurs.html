<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dinosaur Archive | Dino Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07110b;
    color: white;
    font-family: 'Montserrat', sans-serif;
}

/* NAV */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 78px;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    background: rgba(5,15,9,0.85);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(160,195,145,0.15);
}

.logo {
    color: #dcebd4;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
}

.back {
    color: #b8d1ad;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
}

.back:hover {
    color: white;
}

/* HERO */

.hero {
    min-height: 360px;
    padding: 130px 25px 60px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            #193522,
            #07110b 75%
        );
}

.hero-small {
    color: #9fc78c;
    font-size: 12px;
    letter-spacing: 5px;
    font-weight: 600;
    margin-bottom: 18px;
}

.hero h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(45px, 7vw, 80px);
    margin: 0;
    color: #e2eddd;
    line-height: 1;
}

.hero p {
    color: #91a393;
    max-width: 650px;
    margin: 20px auto 0;
    line-height: 1.7;
}

/* ARCHIVE */

.archive {
    max-width: 1200px;
    margin: auto;
    padding: 70px 25px 110px;
}

/* PROFILE */

.dino-profile {

    display: grid;

    grid-template-columns: 1fr 1fr;

    min-height: 600px;

    overflow: hidden;

    background: #0d1911;

    border: 1px solid rgba(155,190,140,0.18);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.4);
}

/* IMAGE AREA */

.dino-photo-container {

    width: 100%;
    height: 600px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            #263f2b,
            #09130c
        );

    overflow: hidden;
}

/* IMPORTANT:
   CONTAIN SHOWS THE WHOLE IMAGE */

.dino-photo {

    width: 100%;
    height: 100%;

    object-fit: contain;

    padding: 20px;

    display: block;
}

/* INFO */

.dino-info {

    padding: 55px;

    display: flex;

    flex-direction: column;

    justify-content: center;
}

.dino-number {

    color: #8fb67e;

    font-size: 11px;

    letter-spacing: 4px;

    margin-bottom: 12px;
}

.dino-info h2 {

    font-family: 'Cinzel', serif;

    font-size: clamp(35px, 4vw, 58px);

    line-height: 1.05;

    margin: 0 0 15px;

    color: #e1ebdd;
}

.period {

    color: #a5b5a0;

    font-size: 13px;

    letter-spacing: 2px;

    margin-bottom: 30px;
}

/* STATS */

.stats {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 30px;
}

.stat {

    padding: 16px;

    background: rgba(255,255,255,0.035);

    border: 1px solid rgba(255,255,255,0.07);
}

.stat-label {

    display: block;

    color: #71816f;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-bottom: 6px;
}

.stat-value {

    color: #d7e5d2;

    font-size: 14px;

    font-weight: 600;
}

/* FACT */

.fact {

    border-left: 2px solid #8fb67e;

    padding-left: 18px;

    color: #9cac99;

    font-size: 13px;

    line-height: 1.8;
}

/* FALLING DINOS */

.falling-dino {

    position: fixed;

    top: -70px;

    font-size: 43px;

    z-index: 90;

    pointer-events: none;

    opacity: 0.4;

    animation: fall linear infinite;
}

@keyframes fall {

    from {
        transform:
            translateY(-80px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(360deg);
    }
}

/* ERROR */

.error {

    text-align: center;

    padding: 100px 20px;

    color: #a5b5a0;
}

.error h2 {

    font-family: 'Cinzel', serif;

    font-size: 40px;

    color: #dcebd4;
}

/* FOOTER */

footer {

    padding: 35px;

    text-align: center;

    background: #040b06;

    color: #657664;

    font-size: 12px;

    letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 850px) {

    .dino-profile {
        grid-template-columns: 1fr;
    }

    .dino-photo-container {
        height: 420px;
    }

    .dino-info {
        padding: 35px 25px;
    }

}

@media (max-width: 600px) {

    nav {
        height: 65px;
        padding: 0 20px;
    }

    .logo {
        font-size: 17px;
    }

    .hero {
        padding-top: 110px;
    }

    .hero h1 {
        font-size: 45px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .dino-photo-container {
        height: 330px;
    }

}

</style>
</head>

<body>

<!-- FALLING DINOSAURS -->

<div class="falling-dino"
     style="left:1%; animation-duration:8s;">
    🦖
</div>

<div class="falling-dino"
     style="left:5%; animation-duration:11s; animation-delay:3s;">
    🦕
</div>

<div class="falling-dino"
     style="right:1%; animation-duration:9s; animation-delay:1s;">
    🦖
</div>

<div class="falling-dino"
     style="right:5%; animation-duration:12s; animation-delay:4s;">
    🦕
</div>


<!-- NAV -->

<nav>

    <a href="index.html" class="logo">
        🦖 DINO EXPLORER
    </a>

    <a href="index.html" class="back">
        ← BACK TO EXPLORE
    </a>

</nav>


<!-- HERO -->

<header class="hero">

    <div>

        <div class="hero-small">
            PREHISTORIC ARCHIVE
        </div>

        <h1 id="heroTitle">
            DINOSAUR
        </h1>

        <p id="heroSubtitle">
            Discover a prehistoric giant.
        </p>

    </div>

</header>


<!-- PROFILE -->

<main class="archive">

    <article id="dinoProfile" class="dino-profile">

        <div class="dino-photo-container">

            <img
                id="dinoImage"
                class="dino-photo"
                src=""
                alt="Dinosaur">

        </div>


        <div class="dino-info">

            <div id="dinoNumber" class="dino-number"></div>

            <h2 id="dinoName"></h2>

            <div id="dinoPeriod" class="period"></div>


            <div class="stats">

                <div class="stat">

                    <span class="stat-label">
                        Diet
                    </span>

                    <span id="dinoDiet" class="stat-value"></span>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        Length
                    </span>

                    <span id="dinoLength" class="stat-value"></span>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        Feature
                    </span>

                    <span id="dinoFeature" class="stat-value"></span>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        Type
                    </span>

                    <span id="dinoType" class="stat-value"></span>

                </div>

            </div>


            <div id="dinoFact" class="fact"></div>

        </div>

    </article>


    <div id="error" class="error" style="display:none;">

        <h2>Dinosaur Not Found 🦖</h2>

        <p>
            Go back to the explore page and choose a dinosaur.
        </p>

    </div>

</main>


<footer>

    🦖 DINO EXPLORER

    <br><br>

    THE PREHISTORIC WORLD AWAITS.

</footer>


<script>

/* ==========================================
   DINOSAUR DATA
========================================== */

const dinosaurs = {

    trex: {
        number: "SPECIES 01",
        name: "Tyrannosaurus Rex",
        period: "LATE CRETACEOUS",
        diet: "Carnivore",
        length: "Around 12 m",
        feature: "Powerful bite",
        type: "Theropod",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/6/6f/Tyrannosaurus_Rex_Holotype.jpg",

        fact:
        "T. rex was one of the most famous predators ever discovered. It had enormous jaws, powerful teeth, and a very strong bite."
    },


    triceratops: {
        number: "SPECIES 02",
        name: "Triceratops",
        period: "LATE CRETACEOUS",
        diet: "Herbivore",
        length: "Around 9 m",
        feature: "Three horns",
        type: "Ceratopsian",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/4/44/Triceratops_BW.jpg",

        fact:
        "Triceratops had a huge skull, a protective frill, and three distinctive horns."
    },


    velociraptor: {
        number: "SPECIES 03",
        name: "Velociraptor",
        period: "LATE CRETACEOUS",
        diet: "Carnivore",
        length: "Around 2 m",
        feature: "Curved claw",
        type: "Dromaeosaur",

        /*
        DIFFERENT IMAGE SOURCE FROM THE OLD BROKEN ONE
        */

        image:
        "https://cdn.britannica.com/72/94872-050-0C8C4A0D/Velociraptor.jpg",

        fact:
        "Real Velociraptors were much smaller than their movie versions and evidence indicates that they had feathers."
    },


    spinosaurus: {
        number: "SPECIES 04",
        name: "Spinosaurus",
        period: "CRETACEOUS",
        diet: "Carnivore",
        length: "Around 14–15 m",
        feature: "Large sail",
        type: "Theropod",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/e/e5/Spinosaurus_aegyptiacus.png",

        fact:
        "Spinosaurus had a long narrow skull and a distinctive sail-like structure along its back."
    },


    stegosaurus: {
        number: "SPECIES 05",
        name: "Stegosaurus",
        period: "LATE JURASSIC",
        diet: "Herbivore",
        length: "Around 9 m",
        feature: "Back plates",
        type: "Thyreophoran",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/0/08/Stegosaurus_BW.jpg",

        fact:
        "Stegosaurus is famous for its large plates along its back and spikes on its tail."
    },


    brachiosaurus: {
        number: "SPECIES 06",
        name: "Brachiosaurus",
        period: "LATE JURASSIC",
        diet: "Herbivore",
        length: "Around 23 m",
        feature: "Long neck",
        type: "Sauropod",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/3/3b/Brachiosaurus_BW.jpg",

        fact:
        "Brachiosaurus had extremely long front legs and a long neck that helped it reach vegetation high above the ground."
    },


    ankylosaurus: {
        number: "SPECIES 07",
        name: "Ankylosaurus",
        period: "LATE CRETACEOUS",
        diet: "Herbivore",
        length: "Around 8 m",
        feature: "Tail club",
        type: "Armored dinosaur",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5e/Ankylosaurus_dinosaur.png",

        fact:
        "Ankylosaurus was covered in heavy armor and had a powerful tail club for defense."
    },


    allosaurus: {
        number: "SPECIES 08",
        name: "Allosaurus",
        period: "LATE JURASSIC",
        diet: "Carnivore",
        length: "Around 9–10 m",
        feature: "Large skull",
        type: "Theropod",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/b/b0/Allosaurus_BW.jpg",

        fact:
        "Allosaurus was a large Jurassic predator with sharp teeth, strong jaws, and three-fingered hands."
    },


    diplodocus: {
        number: "SPECIES 09",
        name: "Diplodocus",
        period: "LATE JURASSIC",
        diet: "Herbivore",
        length: "Around 25–27 m",
        feature: "Whip-like tail",
        type: "Sauropod",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5b/Diplodocus_carnegii.jpg",

        fact:
        "Diplodocus had an extremely long neck and tail. Its tail may have been used like a whip."
    }

};


/* ==========================================
   GET THE DINOSAUR FROM THE URL
========================================== */

const params = new URLSearchParams(window.location.search);

const selected = params.get("dino");


/* ==========================================
   SHOW ONLY THE SELECTED DINOSAUR
========================================== */

if (selected && dinosaurs[selected]) {

    const dino = dinosaurs[selected];


    document.getElementById("heroTitle").textContent =
        dino.name;


    document.getElementById("heroSubtitle").textContent =
        "Discover the world of this prehistoric giant.";


    document.getElementById("dinoNumber").textContent =
        dino.number;


    document.getElementById("dinoName").textContent =
        dino.name;


    document.getElementById("dinoPeriod").textContent =
        dino.period;


    document.getElementById("dinoDiet").textContent =
        dino.diet;


    document.getElementById("dinoLength").textContent =
        dino.length;


    document.getElementById("dinoFeature").textContent =
        dino.feature;


    document.getElementById("dinoType").textContent =
        dino.type;


    document.getElementById("dinoFact").textContent =
        dino.fact;


    document.getElementById("dinoImage").src =
        dino.image;


    document.getElementById("dinoImage").alt =
        dino.name;


} else {

    document.getElementById("dinoProfile").style.display =
        "none";

    document.getElementById("error").style.display =
        "block";

    document.getElementById("heroTitle").textContent =
        "DINO ARCHIVE";

}

</script>

</body>
</html>
