<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dinosaur | Dino Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07110b;
    color: white;
    font-family: 'Montserrat', sans-serif;
}

/* NAV */

nav {
    height: 78px;
    width: 100%;
    padding: 0 5%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(5,15,9,0.85);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(160,195,145,0.18);
}

.logo {
    color: #dcebd4;
    text-decoration: none;

    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
}

.back {
    color: #b8d1ad;
    text-decoration: none;

    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;

    transition: 0.3s;
}

.back:hover {
    color: white;
}

/* MAIN */

.dino-page {
    min-height: calc(100vh - 78px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 60px 5%;
}

/* CARD */

.dino-card {

    width: min(1200px, 100%);

    display: grid;

    grid-template-columns: 1fr 1fr;

    background: #0d1911;

    border: 1px solid rgba(155,190,140,0.2);

    box-shadow: 0 25px 80px rgba(0,0,0,0.5);

    overflow: hidden;
}

/* IMAGE */

.image-box {

    width: 100%;
    height: 650px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #111;

    overflow: hidden;
}

.image-box img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;
}

/* INFO */

.info {

    padding: 60px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.number {

    color: #8fb67e;

    font-size: 11px;

    letter-spacing: 4px;

    margin-bottom: 15px;
}

h1 {

    font-family: 'Cinzel', serif;

    font-size: clamp(40px, 5vw, 65px);

    line-height: 1;

    margin: 0 0 15px;

    color: #e1ebdd;
}

.period {

    color: #a5b5a0;

    font-size: 13px;

    letter-spacing: 2px;

    margin-bottom: 35px;
}

/* STATS */

.stats {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 30px;
}

.stat {

    padding: 17px;

    background: rgba(255,255,255,0.035);

    border: 1px solid rgba(255,255,255,0.07);
}

.label {

    display: block;

    color: #71816f;

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 7px;
}

.value {

    color: #d7e5d2;

    font-size: 14px;

    font-weight: 600;
}

/* FACT */

.fact {

    border-left: 2px solid #8fb67e;

    padding-left: 18px;

    color: #9cac99;

    font-size: 14px;

    line-height: 1.8;
}

/* FALLING DINOS */

.falling-dino {

    position: fixed;

    top: -70px;

    font-size: 42px;

    pointer-events: none;

    opacity: 0.4;

    z-index: 20;

    animation: fall linear infinite;
}

@keyframes fall {

    from {
        transform: translateY(-80px) rotate(0deg);
    }

    to {
        transform: translateY(110vh) rotate(360deg);
    }

}

/* MOBILE */

@media (max-width: 850px) {

    .dino-card {
        grid-template-columns: 1fr;
    }

    .image-box {
        height: 400px;
    }

    .info {
        padding: 35px 25px;
    }

}

@media (max-width: 600px) {

    nav {
        height: 65px;
        padding: 0 20px;
    }

    .logo {
        font-size: 17px;
    }

    .dino-page {
        padding: 30px 15px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<!-- FALLING DINOS -->

<div class="falling-dino"
     style="left:1%; animation-duration:8s;">
    🦖
</div>

<div class="falling-dino"
     style="left:5%; animation-duration:11s; animation-delay:3s;">
    🦕
</div>

<div class="falling-dino"
     style="right:1%; animation-duration:9s; animation-delay:1s;">
    🦖
</div>

<div class="falling-dino"
     style="right:5%; animation-duration:12s; animation-delay:4s;">
    🦕
</div>

<!-- NAV -->

<nav>

    <a href="index.html" class="logo">
        🦖 DINO EXPLORER
    </a>

    <a href="index.html#dinosaurs" class="back">
        ← BACK TO EXPLORE
    </a>

</nav>

<!-- DINOSAUR -->

<main class="dino-page">

    <article class="dino-card">

        <div class="image-box">

            <img id="dinoImage" src="" alt="Dinosaur">

        </div>

        <div class="info">

            <div id="dinoNumber" class="number">
                SPECIES
            </div>

            <h1 id="dinoName">
                Dinosaur
            </h1>

            <div id="dinoPeriod" class="period">
                PREHISTORIC
            </div>

            <div class="stats">

                <div class="stat">
                    <span class="label">Diet</span>
                    <span id="dinoDiet" class="value"></span>
                </div>

                <div class="stat">
                    <span class="label">Length</span>
                    <span id="dinoLength" class="value"></span>
                </div>

                <div class="stat">
                    <span class="label">Feature</span>
                    <span id="dinoFeature" class="value"></span>
                </div>

                <div class="stat">
                    <span class="label">Type</span>
                    <span id="dinoType" class="value"></span>
                </div>

            </div>

            <div id="dinoFact" class="fact"></div>

        </div>

    </article>

</main>

<script>

/* ==========================================
   DINOSAUR DATABASE
   ========================================== */

const dinosaurs = {

    trex: {
        number: "SPECIES 01",
        name: "Tyrannosaurus Rex",
        period: "LATE CRETACEOUS",
        diet: "Carnivore",
        length: "Around 12 m",
        feature: "Powerful jaws",
        type: "Theropod",

        image: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Tyrannosaurus_Rex_Holotype.jpg",

        fact: "T. rex was one of the most famous predators ever to live. It had enormous jaws, powerful teeth and a massive skull."
    },

    triceratops: {
        number: "SPECIES 02",
        name: "Triceratops",
        period: "LATE CRETACEOUS",
        diet: "Herbivore",
        length: "Around 9 m",
        feature: "Three horns",
        type: "Ceratopsian",

        image: "https://upload.wikimedia.org/wikipedia/commons/4/44/Triceratops_BW.jpg",

        fact: "Triceratops had a huge skull, three horns and a large protective frill."
    },

    velociraptor: {
        number: "SPECIES 03",
        name: "Velociraptor",
        period: "LATE CRETACEOUS",
        diet: "Carnivore",
        length: "Around 2 m",
        feature: "Curved claw",
        type: "Dromaeosaur",

        image: "https://commons.wikimedia.org/wiki/Special:FilePath/Velociraptor%20Restoration.png",

        fact: "Real Velociraptors were much smaller than their movie versions. Fossil evidence indicates that they had feathers."
    },

    spinosaurus: {
        number: "SPECIES 04",
        name: "Spinosaurus",
        period: "CRETACEOUS",
        diet: "Carnivore",
        length: "Around 14 m",
        feature: "Large sail",
        type: "Theropod",

        image: "https://upload.wikimedia.org/wikipedia/commons/e/e5/Spinosaurus_aegyptiacus.png",

        fact: "Spinosaurus had a long narrow skull and a distinctive sail-like structure along its back."
    },

    stegosaurus: {
        number: "SPECIES 05",
        name: "Stegosaurus",
        period: "LATE JURASSIC",
        diet: "Herbivore",
        length: "Around 9 m",
        feature: "Back plates",
        type: "Stegosaur",

        image: "https://upload.wikimedia.org/wikipedia/commons/0/08/Stegosaurus_BW.jpg",

        fact: "Stegosaurus had large plates along its back and four long spikes on its tail."
    },

    brachiosaurus: {
        number: "SPECIES 06",
        name: "Brachiosaurus",
        period: "LATE JURASSIC",
        diet: "Herbivore",
        length: "Around 18–22 m",
        feature: "Long neck",
        type: "Sauropod",

        image: "https://upload.wikimedia.org/wikipedia/commons/3/3b/Brachiosaurus_BW.jpg",

        fact: "Brachiosaurus had a very long neck and unusually long front legs, helping it reach vegetation high above the ground."
    },

    ankylosaurus: {
        number: "SPECIES 07",
        name: "Ankylosaurus",
        period: "LATE CRETACEOUS",
        diet: "Herbivore",
        length: "Around 8 m",
        feature: "Tail club",
        type: "Ankylosaur",

        image: "https://upload.wikimedia.org/wikipedia/commons/5/5e/Ankylosaurus_dinosaur.png",

        fact: "Ankylosaurus was covered in bony armor and had a powerful club at the end of its tail."
    },

    allosaurus: {
        number: "SPECIES 08",
        name: "Allosaurus",
        period: "LATE JURASSIC",
        diet: "Carnivore",
        length: "Around 9–10 m",
        feature: "Sharp teeth",
        type: "Theropod",

        image: "https://upload.wikimedia.org/wikipedia/commons/b/b0/Allosaurus_BW.jpg",

        fact: "Allosaurus was a large Jurassic predator with powerful jaws, sharp teeth and three-fingered hands."
    },

    diplodocus: {
        number: "SPECIES 09",
        name: "Diplodocus",
        period: "LATE JURASSIC",
        diet: "Herbivore",
        length: "Around 24–26 m",
        feature: "Whip-like tail",
        type: "Sauropod",

        image: "https://upload.wikimedia.org/wikipedia/commons/5/5b/Diplodocus_carnegii.jpg",

        fact: "Diplodocus had an extremely long neck and tail. Its tail may have been used like a whip."
    }

};


/* ==========================================
   GET ?dino= FROM THE URL
   ========================================== */

const params = new URLSearchParams(window.location.search);

const selectedDino = params.get("dino");

const dino = dinosaurs[selectedDino];


/* ==========================================
   DISPLAY ONLY THE SELECTED DINOSAUR
   ========================================== */

if (dino) {

    document.getElementById("dinoNumber").textContent =
        dino.number;

    document.getElementById("dinoName").textContent =
        dino.name;

    document.getElementById("dinoPeriod").textContent =
        dino.period;

    document.getElementById("dinoDiet").textContent =
        dino.diet;

    document.getElementById("dinoLength").textContent =
        dino.length;

    document.getElementById("dinoFeature").textContent =
        dino.feature;

    document.getElementById("dinoType").textContent =
        dino.type;

    document.getElementById("dinoFact").textContent =
        dino.fact;

    const image =
        document.getElementById("dinoImage");

    image.src = dino.image;
    image.alt = dino.name;

    document.title =
        dino.name + " | Dino Explorer";

}


/* ==========================================
   INVALID DINOSAUR
   ========================================== */

else {

    document.getElementById("dinoNumber").textContent =
        "ERROR";

    document.getElementById("dinoName").textContent =
        "Dinosaur Not Found";

    document.getElementById("dinoPeriod").textContent =
        "RETURN TO THE EXPLORE PAGE";

    document.getElementById("dinoFact").textContent =
        "Choose a dinosaur from the Dino Explorer homepage.";

}

</script>

</body>
</html>
