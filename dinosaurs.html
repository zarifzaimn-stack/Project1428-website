<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dinosaur Archive | Dino Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07110b;
    color: white;
    font-family: 'Montserrat', sans-serif;
}

/* ================= NAV ================= */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 78px;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    background: rgba(5, 15, 9, 0.82);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(160, 195, 145, 0.15);
}

.logo {
    color: #dcebd4;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
}

.back {
    color: #b8d1ad;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
}

.back:hover {
    color: white;
}

/* ================= MAIN ================= */

.page {
    min-height: 100vh;
    padding: 130px 25px 80px;
}

/* ================= DINO CARD ================= */

.dino-profile {

    max-width: 1200px;
    min-height: 620px;

    margin: 0 auto;

    display: grid;
    grid-template-columns: 1fr 1fr;

    background: #0d1911;

    border: 1px solid rgba(155, 190, 140, 0.18);

    box-shadow:
        0 25px 80px rgba(0,0,0,0.45);

    overflow: hidden;
}

/* ================= IMAGE SIDE ================= */

.image-box {

    min-height: 620px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 35px;

    background:
        radial-gradient(
            circle at center,
            #203b27,
            #09140c 75%
        );
}

/*
   IMPORTANT:
   contain = whole dinosaur image stays visible.
   It will NOT crop the image.
*/

.dino-photo {

    width: 100%;
    height: 100%;

    max-height: 550px;

    object-fit: contain;

    display: block;

    filter: drop-shadow(
        0 20px 25px rgba(0,0,0,0.45)
    );
}

/* ================= INFO ================= */

.dino-info {

    padding: 65px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.dino-number {

    color: #8fb67e;

    font-size: 11px;

    letter-spacing: 4px;

    margin-bottom: 15px;
}

.dino-info h1 {

    font-family: 'Cinzel', serif;

    font-size: clamp(38px, 4vw, 60px);

    line-height: 1.05;

    margin: 0 0 15px;

    color: #e1ebdd;
}

.period {

    color: #a5b5a0;

    font-size: 13px;

    letter-spacing: 2px;

    margin-bottom: 35px;
}

/* ================= STATS ================= */

.stats {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 30px;
}

.stat {

    padding: 17px;

    background: rgba(255,255,255,0.035);

    border: 1px solid rgba(255,255,255,0.07);
}

.stat-label {

    display: block;

    color: #71816f;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-bottom: 7px;
}

.stat-value {

    color: #d7e5d2;

    font-size: 14px;

    font-weight: 600;
}

/* ================= FACT ================= */

.fact {

    border-left: 2px solid #8fb67e;

    padding-left: 18px;

    color: #9cac99;

    font-size: 13px;

    line-height: 1.9;
}

/* ================= FALLING DINOS ================= */

.falling-dino {

    position: fixed;

    top: -70px;

    font-size: 43px;

    z-index: 90;

    pointer-events: none;

    opacity: 0.35;

    animation: fall linear infinite;
}

@keyframes fall {

    from {
        transform:
            translateY(-80px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(360deg);
    }

}

/* ================= FOOTER ================= */

footer {

    padding: 35px;

    text-align: center;

    background: #040b06;

    color: #657664;

    font-size: 12px;

    letter-spacing: 1px;
}

/* ================= ERROR ================= */

#error {

    display: none;

    max-width: 700px;

    margin: 100px auto;

    text-align: center;

    padding: 50px;

    background: #0d1911;

    border: 1px solid rgba(155,190,140,0.2);
}

#error h1 {

    font-family: 'Cinzel', serif;

    color: #dcebd4;
}

#error a {

    display: inline-block;

    margin-top: 20px;

    padding: 13px 25px;

    background: #8fb67e;

    color: #07110b;

    text-decoration: none;

    font-weight: 700;
}

/* ================= MOBILE ================= */

@media (max-width: 850px) {

    nav {
        height: 65px;
    }

    .logo {
        font-size: 17px;
    }

    .dino-profile {

        grid-template-columns: 1fr;

        min-height: auto;
    }

    .image-box {

        min-height: 400px;

        height: 400px;

        padding: 25px;
    }

    .dino-photo {

        max-height: 350px;
    }

    .dino-info {

        padding: 40px 30px;
    }

}

@media (max-width: 550px) {

    .page {

        padding: 105px 15px 60px;
    }

    .image-box {

        height: 330px;

        min-height: 330px;
    }

    .dino-photo {

        max-height: 290px;
    }

    .dino-info {

        padding: 30px 22px;
    }

    .stats {

        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>


<!-- FALLING DINOSAURS -->

<div class="falling-dino"
     style="left:1%; animation-duration:8s;">
    🦖
</div>

<div class="falling-dino"
     style="left:5%; animation-duration:11s; animation-delay:3s;">
    🦕
</div>

<div class="falling-dino"
     style="right:1%; animation-duration:9s; animation-delay:1s;">
    🦖
</div>

<div class="falling-dino"
     style="right:5%; animation-duration:12s; animation-delay:4s;">
    🦕
</div>


<!-- NAVIGATION -->

<nav>

    <a href="index.html" class="logo">
        🦖 DINO EXPLORER
    </a>

    <a href="index.html" class="back">
        ← BACK TO EXPLORE
    </a>

</nav>


<!-- MAIN -->

<main class="page">


    <!-- DINOSAUR PROFILE -->

    <article id="dinoProfile" class="dino-profile">

        <!-- IMAGE -->

        <div class="image-box">

            <img
                id="dinoImage"
                class="dino-photo"
                src=""
                alt=""
            >

        </div>


        <!-- INFORMATION -->

        <div class="dino-info">

            <div id="dinoNumber" class="dino-number">
                SPECIES
            </div>

            <h1 id="dinoName">
                Dinosaur
            </h1>

            <div id="dinoPeriod" class="period">
                PERIOD
            </div>


            <div class="stats">

                <div class="stat">

                    <span class="stat-label">
                        Diet
                    </span>

                    <span id="dinoDiet" class="stat-value">
                    </span>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        Length
                    </span>

                    <span id="dinoLength" class="stat-value">
                    </span>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        Feature
                    </span>

                    <span id="dinoFeature" class="stat-value">
                    </span>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        Type
                    </span>

                    <span id="dinoType" class="stat-value">
                    </span>

                </div>

            </div>


            <div id="dinoFact" class="fact">
            </div>

        </div>

    </article>


    <!-- ERROR MESSAGE -->

    <div id="error">

        <h1>Dinosaur Not Found 🦖</h1>

        <p>
            Please go back and choose a dinosaur from the explorer.
        </p>

        <a href="index.html">
            ← BACK TO DINOSAURS
        </a>

    </div>


</main>


<footer>

    🦖 DINO EXPLORER

    <br><br>

    THE PREHISTORIC WORLD AWAITS.

</footer>


<script>

/* =====================================================
   DINOSAUR DATABASE
   THESE ARE THE SAME IMAGE LINKS USED ON INDEX.HTML
===================================================== */

const dinosaurs = {

    trex: {

        number: "SPECIES 01",

        name: "Tyrannosaurus Rex",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/6/6f/Tyrannosaurus_Rex_Holotype.jpg",

        period: "LATE CRETACEOUS",

        diet: "Carnivore",

        length: "Around 12 m",

        feature: "Powerful jaws",

        type: "Theropod",

        fact:
        "Tyrannosaurus rex was one of the most famous predators of the prehistoric world. It had enormous jaws, powerful teeth, and a massive skull built for hunting."
    },


    triceratops: {

        number: "SPECIES 02",

        name: "Triceratops",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/4/44/Triceratops_BW.jpg",

        period: "LATE CRETACEOUS",

        diet: "Herbivore",

        length: "Around 9 m",

        feature: "Three horns",

        type: "Ceratopsian",

        fact:
        "Triceratops had a huge skull, a protective frill, and three distinctive horns. It was one of the most recognizable plant-eating dinosaurs."
    },


    velociraptor: {

        number: "SPECIES 03",

        name: "Velociraptor",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5e/Velociraptor_restoration.png",

        period: "LATE CRETACEOUS",

        diet: "Carnivore",

        length: "Around 2 m",

        feature: "Curved claw",

        type: "Dromaeosaur",

        fact:
        "Real Velociraptors were much smaller than their movie versions. Fossil evidence indicates that they had feathers and a large curved claw on each foot."
    },


    spinosaurus: {

        number: "SPECIES 04",

        name: "Spinosaurus",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/e/e5/Spinosaurus_aegyptiacus.png",

        period: "CRETACEOUS",

        diet: "Carnivore",

        length: "Around 15 m",

        feature: "Large sail",

        type: "Theropod",

        fact:
        "Spinosaurus had a long, narrow skull and a distinctive sail-like structure along its back. Fossils suggest it was strongly associated with aquatic environments."
    },


    stegosaurus: {

        number: "SPECIES 05",

        name: "Stegosaurus",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/0/08/Stegosaurus_BW.jpg",

        period: "LATE JURASSIC",

        diet: "Herbivore",

        length: "Around 9 m",

        feature: "Back plates",

        type: "Stegosaur",

        fact:
        "Stegosaurus had large plates along its back and four long spikes at the end of its tail, which may have helped with defense."
    },


    brachiosaurus: {

        number: "SPECIES 06",

        name: "Brachiosaurus",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/3/3b/Brachiosaurus_BW.jpg",

        period: "LATE JURASSIC",

        diet: "Herbivore",

        length: "Around 23 m",

        feature: "Long neck",

        type: "Sauropod",

        fact:
        "Brachiosaurus had very long front legs and a high-reaching neck, allowing it to feed on vegetation high above the ground."
    },


    ankylosaurus: {

        number: "SPECIES 07",

        name: "Ankylosaurus",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5e/Ankylosaurus_dinosaur.png",

        period: "LATE CRETACEOUS",

        diet: "Herbivore",

        length: "Around 8 m",

        feature: "Tail club",

        type: "Ankylosaur",

        fact:
        "Ankylosaurus was covered in heavy bony armor and had a powerful tail club that could be used as a defensive weapon."
    },


    allosaurus: {

        number: "SPECIES 08",

        name: "Allosaurus",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/b/b0/Allosaurus_BW.jpg",

        period: "LATE JURASSIC",

        diet: "Carnivore",

        length: "Around 9.5 m",

        feature: "Sharp teeth",

        type: "Theropod",

        fact:
        "Allosaurus was a major predator of the Late Jurassic. It had a large skull, sharp teeth, and powerful arms with claws."
    },


    diplodocus: {

        number: "SPECIES 09",

        name: "Diplodocus",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5b/Diplodocus_carnegii.jpg",

        period: "LATE JURASSIC",

        diet: "Herbivore",

        length: "Around 25 m",

        feature: "Whip-like tail",

        type: "Sauropod",

        fact:
        "Diplodocus had an extremely long neck and tail. Its tail may have been capable of moving very quickly like a whip."
    }

};


/* =====================================================
   GET THE DINOSAUR FROM THE URL
===================================================== */

const params = new URLSearchParams(window.location.search);

const selectedDino = params.get("dino");


/* =====================================================
   SHOW ONLY THE SELECTED DINOSAUR
===================================================== */

if (selectedDino && dinosaurs[selectedDino]) {

    const dino = dinosaurs[selectedDino];

    document.getElementById("dinoNumber").textContent =
        dino.number;

    document.getElementById("dinoName").textContent =
        dino.name;

    document.getElementById("dinoPeriod").textContent =
        dino.period;

    document.getElementById("dinoDiet").textContent =
        dino.diet;

    document.getElementById("dinoLength").textContent =
        dino.length;

    document.getElementById("dinoFeature").textContent =
        dino.feature;

    document.getElementById("dinoType").textContent =
        dino.type;

    document.getElementById("dinoFact").textContent =
        dino.fact;

    const image = document.getElementById("dinoImage");

    image.src = dino.image;

    image.alt = dino.name;

    document.title =
        dino.name + " | Dino Explorer";

} else {

    /* No valid dinosaur was selected */

    document.getElementById("dinoProfile").style.display =
        "none";

    document.getElementById("error").style.display =
        "block";

}

</script>

</body>
</html>
