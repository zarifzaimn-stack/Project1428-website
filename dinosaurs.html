<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dinosaur Archive | Dino Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #07110b;
    color: white;
    font-family: 'Montserrat', sans-serif;
}

/* =========================
   NAVIGATION
========================= */

nav {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 78px;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    background: rgba(5,15,9,0.78);

    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(160,195,145,0.15);
}

.logo {
    color: #dcebd4;

    text-decoration: none;

    font-family: 'Cinzel', serif;

    font-size: 22px;

    font-weight: 700;

    letter-spacing: 2px;
}

.back {
    color: #b8d1ad;

    text-decoration: none;

    font-size: 13px;

    font-weight: 600;

    letter-spacing: 1px;

    transition: .3s;
}

.back:hover {
    color: white;
}

/* =========================
   HERO
========================= */

.hero {

    min-height: 430px;

    padding: 145px 25px 70px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    position: relative;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #193522,
            #07110b 72%
        );
}

.hero-content {
    position: relative;
    z-index: 3;

    max-width: 900px;
}

.hero-small {

    color: #9fc78c;

    font-size: 12px;

    letter-spacing: 5px;

    font-weight: 600;

    margin-bottom: 20px;
}

.hero h1 {

    font-family: 'Cinzel', serif;

    font-size: clamp(48px,8vw,90px);

    margin: 0;

    color: #e2eddd;

    line-height: 1;

    letter-spacing: 2px;
}

.hero p {

    max-width: 650px;

    margin: 25px auto 0;

    color: #91a393;

    line-height: 1.8;

    font-size: 15px;
}

/* =========================
   DINOSAUR PROFILE
========================= */

.archive {

    max-width: 1250px;

    margin: auto;

    padding: 70px 25px 120px;
}

.dino-profile {

    display: grid;

    grid-template-columns: 1fr 1fr;

    min-height: 600px;

    overflow: hidden;

    background: #0d1911;

    border: 1px solid rgba(155,190,140,.18);

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);
}

/* =========================
   IMAGE
========================= */

.image-container {

    width: 100%;

    min-height: 600px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle,
            #263d2a,
            #07110b
        );

    overflow: hidden;
}

.dino-photo {

    width: 100%;

    height: 100%;

    min-height: 600px;

    /*
       THIS KEEPS THE WHOLE IMAGE VISIBLE.
    */

    object-fit: contain;

    object-position: center;

    padding: 30px;

    display: block;

    transition: transform .5s ease;
}

.image-container:hover .dino-photo {

    transform: scale(1.03);
}

/* =========================
   INFORMATION
========================= */

.dino-info {

    padding: 55px;

    display: flex;

    flex-direction: column;

    justify-content: center;
}

.dino-number {

    color: #8fb67e;

    font-size: 11px;

    letter-spacing: 4px;

    margin-bottom: 12px;
}

.dino-info h2 {

    font-family: 'Cinzel', serif;

    font-size: clamp(32px,4vw,55px);

    line-height: 1.05;

    margin: 0 0 15px;

    color: #e1ebdd;
}

.period {

    color: #a5b5a0;

    font-size: 13px;

    letter-spacing: 1px;

    margin-bottom: 30px;
}

/* =========================
   STATS
========================= */

.stats {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 30px;
}

.stat {

    padding: 16px;

    background: rgba(255,255,255,.035);

    border: 1px solid rgba(255,255,255,.07);
}

.stat-label {

    display: block;

    color: #71816f;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-bottom: 6px;
}

.stat-value {

    color: #d7e5d2;

    font-size: 14px;

    font-weight: 600;
}

/* =========================
   FACT
========================= */

.fact {

    border-left: 2px solid #8fb67e;

    padding-left: 18px;

    color: #9cac99;

    font-size: 13px;

    line-height: 1.8;
}

/* =========================
   BACK BUTTON
========================= */

.back-button {

    display: inline-block;

    margin-top: 30px;

    padding: 13px 22px;

    color: #dcebd4;

    text-decoration: none;

    border: 1px solid rgba(159,199,140,.5);

    background: rgba(50,85,48,.35);

    font-size: 12px;

    letter-spacing: 1px;

    transition: .3s;
}

.back-button:hover {

    background: #8eb879;

    color: #07110b;
}

/* =========================
   FALLING DINOSAURS
========================= */

.falling-dino {

    position: fixed;

    top: -70px;

    font-size: 43px;

    z-index: 90;

    pointer-events: none;

    opacity: .45;

    animation: fall linear infinite;
}

@keyframes fall {

    from {

        transform:
            translateY(-80px)
            rotate(0deg);

    }

    to {

        transform:
            translateY(110vh)
            rotate(360deg);

    }

}

/* =========================
   FOOTER
========================= */

footer {

    padding: 35px;

    text-align: center;

    background: #040b06;

    color: #657664;

    font-size: 12px;

    letter-spacing: 1px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px) {

    .dino-profile {

        grid-template-columns: 1fr;

    }

    .image-container {

        min-height: 420px;

        height: 420px;
    }

    .dino-photo {

        min-height: 420px;

        height: 420px;

        padding: 20px;
    }

    .dino-info {

        padding: 35px 25px;

    }

}

@media(max-width:600px) {

    nav {

        height: 65px;

        padding: 0 20px;

    }

    .logo {

        font-size: 18px;

    }

    .hero {

        min-height: 390px;

    }

    .hero h1 {

        font-size: 48px;

    }

    .stats {

        grid-template-columns: 1fr;

    }

}

</style>

</head>

<body>


<!-- =========================
     FALLING DINOS
========================= -->

<div class="falling-dino"
     style="left:1%; animation-duration:8s;">
    🦖
</div>

<div class="falling-dino"
     style="left:5%; animation-duration:11s; animation-delay:3s;">
    🦕
</div>

<div class="falling-dino"
     style="right:1%; animation-duration:9s; animation-delay:1s;">
    🦖
</div>

<div class="falling-dino"
     style="right:5%; animation-duration:12s; animation-delay:4s;">
    🦕
</div>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

<a href="index.html" class="logo">
🦖 DINO EXPLORER
</a>

<a href="index.html" class="back">
← BACK TO EXPLORE
</a>

</nav>


<!-- =========================
     HERO
========================= -->

<header class="hero">

<div class="hero-content">

<div class="hero-small">
PREHISTORIC ARCHIVE
</div>

<h1 id="heroTitle">
THE DINOSAUR
</h1>

<p id="heroDescription">
Explore one of Earth's incredible prehistoric creatures.
</p>

</div>

</header>


<!-- =========================
     DINOSAUR
========================= -->

<main class="archive">

<article class="dino-profile">

<div class="image-container">

<img
id="dinoImage"
class="dino-photo"
src=""
alt="Dinosaur">

</div>


<div class="dino-info">

<div
id="dinoNumber"
class="dino-number">
SPECIES
</div>

<h2 id="dinoName">
Dinosaur
</h2>

<div
id="dinoPeriod"
class="period">
PREHISTORIC PERIOD
</div>


<div class="stats">


<div class="stat">

<span class="stat-label">
DIET
</span>

<span
id="dinoDiet"
class="stat-value">
-
</span>

</div>


<div class="stat">

<span class="stat-label">
LENGTH
</span>

<span
id="dinoLength"
class="stat-value">
-
</span>

</div>


<div class="stat">

<span class="stat-label">
FEATURE
</span>

<span
id="dinoFeature"
class="stat-value">
-
</span>

</div>


<div class="stat">

<span class="stat-label">
TYPE
</span>

<span
id="dinoType"
class="stat-value">
-
</span>

</div>


</div>


<div
id="dinoFact"
class="fact">
-
</div>


<a
href="index.html#dinosaurs"
class="back-button">

← BACK TO DINOSAURS

</a>

</div>

</article>

</main>


<footer>

🦖 DINO EXPLORER

<br><br>

THE PREHISTORIC WORLD AWAITS.

</footer>


<script>

/* ==================================================
   DINOSAUR DATABASE

   THESE IMAGE LINKS MATCH THE INDEX PAGE.
================================================== */

const dinosaurs = {

trex: {

number: "SPECIES 01",

name: "Tyrannosaurus Rex",

period: "LATE CRETACEOUS",

diet: "Carnivore",

length: "Around 12 m",

feature: "Powerful jaws",

type: "Theropod",

image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Tyrannosaurus_rex_RTMP.jpg",

fact: "One of the most famous dinosaurs ever discovered, T. rex had enormous jaws, powerful teeth, and a strong body built for hunting and scavenging."

},

triceratops: {

number: "SPECIES 02",

name: "Triceratops",

period: "LATE CRETACEOUS",

diet: "Herbivore",

length: "Around 9 m",

feature: "Three horns",

type: "Ceratopsian",

image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Triceratops_side_view.jpg",

fact: "Triceratops had a huge skull, a protective frill, and three distinctive horns."

},

velociraptor: {

number: "SPECIES 03",

name: "Velociraptor",

period: "LATE CRETACEOUS",

diet: "Carnivore",

length: "Around 2 m",

feature: "Curved claw",

type: "Dromaeosaur",

image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Velociraptor_Restoration.png",

fact: "Real Velociraptors were much smaller than their movie versions. Fossil evidence also indicates that they had feathers."

},

spinosaurus: {

number: "SPECIES 04",

name: "Spinosaurus",

period: "CRETACEOUS",

diet: "Carnivore",

length: "Around 14–15 m",

feature: "Large sail",

type: "Theropod",

image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Spinosaurus_aegyptiacus.jpg",

fact: "Spinosaurus had a long, narrow skull and a distinctive sail-like structure along its back."

},

stegosaurus: {

number: "SPECIES 05",

name: "Stegosaurus",

period: "LATE JURASSIC",

diet: "Herbivore",

length: "Around 9 m",

feature: "Back plates",

type: "Stegosaur",

image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Stegosaurus_BW.jpg",

fact: "Stegosaurus was famous for its large plates along its back and spikes on the end of its tail."

},

brachiosaurus: {

number: "SPECIES 06",

name: "Brachiosaurus",

period: "LATE JURASSIC",

diet: "Herbivore",

length: "Around 18–22 m",

feature: "Very long neck",

type: "Sauropod",

image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Brachiosaurus_BW.jpg",

fact: "Brachiosaurus had a long neck and unusually long front legs that helped it reach vegetation high above the ground."

},

ankylosaurus: {

number: "SPECIES 07",

name: "Ankylosaurus",

period: "LATE CRETACEOUS",

diet: "Herbivore",

length: "Around 6–8 m",

feature: "Tail club",

type: "Ankylosaur",

image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Ankylosaurus_dinosaur.png",

fact: "Ankylosaurus was heavily armored and had a powerful club at the end of its tail."

},

allosaurus: {

number: "SPECIES 08",

name: "Allosaurus",

period: "LATE JURASSIC",

diet: "Carnivore",

length: "Around 9–10 m",

feature: "Sharp teeth",

type: "Theropod",

image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Allosaurus_BW.jpg",

fact: "Allosaurus was a large Jurassic predator with powerful jaws and distinctive ridges above its eyes."

},

diplodocus: {

number: "SPECIES 09",

name: "Diplodocus",

period: "LATE JURASSIC",

diet: "Herbivore",

length: "Around 24–26 m",

feature: "Whip-like tail",

type: "Sauropod",

image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Diplodocus_carnegii.jpg",

fact: "Diplodocus had an extremely long neck and tail, making it one of the longest dinosaurs known from complete skeletons."

}

};


/* ==================================================
   GET THE DINOSAUR FROM THE URL
================================================== */

const urlParams = new URLSearchParams(window.location.search);

const selectedDino = urlParams.get("dino");


/* ==================================================
   FIND THE DINOSAUR
================================================== */

const dino = dinosaurs[selectedDino];


/* ==================================================
   DISPLAY ONLY THE SELECTED DINOSAUR
================================================== */

if (dino) {

document.getElementById("dinoImage").src = dino.image;

document.getElementById("dinoImage").alt = dino.name;

document.getElementById("dinoNumber").textContent = dino.number;

document.getElementById("dinoName").textContent = dino.name;

document.getElementById("dinoPeriod").textContent = dino.period;

document.getElementById("dinoDiet").textContent = dino.diet;

document.getElementById("dinoLength").textContent = dino.length;

document.getElementById("dinoFeature").textContent = dino.feature;

document.getElementById("dinoType").textContent = dino.type;

document.getElementById("dinoFact").textContent = dino.fact;

document.getElementById("heroTitle").textContent = dino.name;

document.getElementById("heroDescription").textContent =
"Discover the world of " + dino.name + ".";

}


/* ==================================================
   IF SOMEONE OPENS DINOSAURS.HTML DIRECTLY
================================================== */

else {

document.getElementById("dinoImage").style.display = "none";

document.getElementById("dinoName").textContent =
"Dinosaur Not Found";

document.getElementById("heroTitle").textContent =
"SPECIES NOT FOUND";

document.getElementById("heroDescription").textContent =
"Please return to the dinosaur archive and select a species.";

document.getElementById("dinoFact").textContent =
"No dinosaur was selected.";

}

</script>

</body>

</html>
