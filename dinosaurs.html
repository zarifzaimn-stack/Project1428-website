<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dinosaur | Dino Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #07110b;
    color: white;
    font-family: 'Montserrat', sans-serif;
}


/* =========================
   NAVIGATION
========================= */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 78px;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    background: rgba(5, 15, 9, 0.78);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(160, 195, 145, 0.15);
}

.logo {
    color: #dcebd4;
    text-decoration: none;

    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
}

.back {
    color: #b8d1ad;
    text-decoration: none;

    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;

    transition: 0.3s;
}

.back:hover {
    color: white;
}


/* =========================
   HERO
========================= */

.hero {
    min-height: 480px;

    padding: 150px 25px 80px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #193522,
            #07110b 72%
        );
}

.hero-content {
    max-width: 900px;
    position: relative;
    z-index: 3;
}

.hero-small {
    color: #9fc78c;

    font-size: 12px;
    letter-spacing: 5px;
    font-weight: 600;

    margin-bottom: 20px;
}

.hero h1 {
    font-family: 'Cinzel', serif;

    font-size: clamp(48px, 8vw, 85px);

    margin: 0;

    color: #e2eddd;

    letter-spacing: 2px;
    line-height: 1;
}

.hero p {
    max-width: 650px;

    margin: 25px auto 0;

    color: #91a393;

    line-height: 1.8;

    font-size: 15px;
}


/* =========================
   PROFILE
========================= */

.archive {
    max-width: 1250px;

    margin: auto;

    padding: 80px 25px 120px;
}

.dino-profile {
    display: grid;

    grid-template-columns: 1.1fr 1fr;

    min-height: 570px;

    overflow: hidden;

    background: #0d1911;

    border: 1px solid rgba(155, 190, 140, 0.18);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.45);

    animation: appear 0.7s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================
   IMAGE
========================= */

.dino-photo {
    width: 100%;
    height: 100%;
    min-height: 570px;

    object-fit: cover;

    display: block;

    transition: 0.6s;
}

.dino-photo:hover {
    transform: scale(1.03);
}


/* =========================
   INFO
========================= */

.dino-info {
    padding: 55px;

    display: flex;

    flex-direction: column;

    justify-content: center;
}

.dino-number {
    color: #8fb67e;

    font-size: 11px;

    letter-spacing: 4px;

    margin-bottom: 12px;
}

.dino-info h2 {
    font-family: 'Cinzel', serif;

    font-size: clamp(35px, 4vw, 58px);

    line-height: 1.05;

    margin: 0 0 15px;

    color: #e1ebdd;
}

.period {
    color: #a5b5a0;

    font-size: 13px;

    letter-spacing: 2px;

    margin-bottom: 30px;
}


/* =========================
   STATS
========================= */

.stats {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 30px;
}

.stat {
    padding: 17px;

    background: rgba(255,255,255,0.035);

    border: 1px solid rgba(255,255,255,0.07);

    transition: 0.3s;
}

.stat:hover {
    background: rgba(143,182,126,0.08);

    border-color: rgba(143,182,126,0.3);
}

.stat-label {
    display: block;

    color: #71816f;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-bottom: 6px;
}

.stat-value {
    color: #d7e5d2;

    font-size: 14px;

    font-weight: 600;
}


/* =========================
   FACT
========================= */

.fact {
    border-left: 2px solid #8fb67e;

    padding-left: 18px;

    color: #9cac99;

    font-size: 13px;

    line-height: 1.8;
}


/* =========================
   ERROR MESSAGE
========================= */

.error {
    text-align: center;

    padding: 100px 20px;

    color: #b8c7b4;
}

.error h2 {
    font-family: 'Cinzel', serif;

    color: #dcebd4;

    font-size: 40px;
}

.error a {
    display: inline-block;

    margin-top: 20px;

    padding: 13px 25px;

    background: #8fb67e;

    color: #07110b;

    text-decoration: none;

    font-weight: 700;

    border-radius: 4px;
}


/* =========================
   FALLING DINOSAURS
========================= */

.falling-dino {
    position: fixed;

    top: -80px;

    font-size: 43px;

    z-index: 90;

    pointer-events: none;

    opacity: 0.4;

    animation: fall linear infinite;
}

@keyframes fall {

    from {
        transform:
            translateY(-80px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(360deg);
    }
}


/* =========================
   FOOTER
========================= */

footer {
    padding: 35px;

    text-align: center;

    background: #040b06;

    color: #657664;

    font-size: 12px;

    letter-spacing: 1px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 850px) {

    .dino-profile {
        grid-template-columns: 1fr;
    }

    .dino-photo {
        min-height: 380px;
        height: 380px;
    }

    .dino-info {
        padding: 40px 25px;
    }

}

@media (max-width: 600px) {

    nav {
        height: 65px;
        padding: 0 20px;
    }

    .logo {
        font-size: 18px;
    }

    .hero {
        min-height: 420px;
    }

    .hero h1 {
        font-size: 45px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .dino-info h2 {
        font-size: 38px;
    }

}

</style>

</head>


<body>


<!-- =========================
     FALLING DINOSAURS
========================= -->

<div class="falling-dino"
     style="left:1%; animation-duration:8s;">
    🦖
</div>

<div class="falling-dino"
     style="left:5%; animation-duration:11s; animation-delay:3s;">
    🦕
</div>

<div class="falling-dino"
     style="right:1%; animation-duration:9s; animation-delay:1s;">
    🦖
</div>

<div class="falling-dino"
     style="right:5%; animation-duration:12s; animation-delay:4s;">
    🦕
</div>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

    <a href="index.html" class="logo">
        🦖 DINO EXPLORER
    </a>

    <a href="index.html" class="back">
        ← BACK TO EXPLORE
    </a>

</nav>


<!-- =========================
     HERO
========================= -->

<header class="hero">

    <div class="hero-content">

        <div class="hero-small">
            PREHISTORIC ARCHIVE
        </div>

        <h1 id="heroTitle">
            THE DINOSAURS
        </h1>

        <p id="heroSubtitle">
            Discover the creature that ruled Earth
            millions of years before us.
        </p>

    </div>

</header>


<!-- =========================
     DINOSAUR PROFILE
========================= -->

<main class="archive">

    <div id="dinoContainer"></div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    🦖 DINO EXPLORER

    <br><br>

    THE PREHISTORIC WORLD AWAITS.

</footer>


<script>

/* =====================================================
   DINOSAUR DATABASE
===================================================== */

const dinosaurs = {

    trex: {

        number: "SPECIES 01",

        name: "Tyrannosaurus Rex",

        period: "LATE CRETACEOUS",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/6/6f/Tyrannosaurus_Rex_Holotype.jpg",

        alt: "Tyrannosaurus Rex",

        stats: [

            ["Diet", "Carnivore"],

            ["Length", "Around 12 m"],

            ["Period", "Cretaceous"],

            ["Type", "Theropod"]

        ],

        fact:
        "One of the most famous dinosaurs ever discovered, T. rex had enormous jaws, powerful teeth, and a massive skull built for hunting."

    },


    triceratops: {

        number: "SPECIES 02",

        name: "Triceratops",

        period: "LATE CRETACEOUS",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/4/44/Triceratops_BW.jpg",

        alt: "Triceratops",

        stats: [

            ["Diet", "Herbivore"],

            ["Length", "Around 9 m"],

            ["Defense", "Three horns"],

            ["Type", "Ceratopsian"]

        ],

        fact:
        "Triceratops had a huge skull, a protective frill, and three distinctive horns. It lived near the end of the Cretaceous Period."

    },


    velociraptor: {

        number: "SPECIES 03",

        name: "Velociraptor",

        period: "LATE CRETACEOUS",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5e/Velociraptor_restoration.png",

        alt: "Velociraptor",

        stats: [

            ["Diet", "Carnivore"],

            ["Length", "Around 2 m"],

            ["Feature", "Curved claw"],

            ["Type", "Dromaeosaur"]

        ],

        fact:
        "Real Velociraptors were much smaller than their movie versions. Fossil evidence indicates they had feathers."

    },


    spinosaurus: {

        number: "SPECIES 04",

        name: "Spinosaurus",

        period: "CRETACEOUS",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/e/e5/Spinosaurus_aegyptiacus.png",

        alt: "Spinosaurus",

        stats: [

            ["Diet", "Carnivore"],

            ["Feature", "Large sail"],

            ["Habitat", "Near water"],

            ["Type", "Theropod"]

        ],

        fact:
        "Spinosaurus had a long, narrow skull and a distinctive sail-like structure along its back. Evidence suggests it was strongly adapted to life around water."

    },


    stegosaurus: {

        number: "SPECIES 05",

        name: "Stegosaurus",

        period: "LATE JURASSIC",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/0/08/Stegosaurus_BW.jpg",

        alt: "Stegosaurus",

        stats: [

            ["Diet", "Herbivore"],

            ["Length", "Around 9 m"],

            ["Defense", "Tail spikes"],

            ["Type", "Thyreophoran"]

        ],

        fact:
        "Stegosaurus is famous for the large plates along its back and the four spikes at the end of its tail."

    },


    brachiosaurus: {

        number: "SPECIES 06",

        name: "Brachiosaurus",

        period: "LATE JURASSIC",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/3/3b/Brachiosaurus_BW.jpg",

        alt: "Brachiosaurus",

        stats: [

            ["Diet", "Herbivore"],

            ["Length", "Around 23 m"],

            ["Feature", "Long neck"],

            ["Type", "Sauropod"]

        ],

        fact:
        "Brachiosaurus had unusually long front legs and a very long neck, allowing it to reach vegetation high above the ground."

    },


    ankylosaurus: {

        number: "SPECIES 07",

        name: "Ankylosaurus",

        period: "LATE CRETACEOUS",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5e/Ankylosaurus_dinosaur.png",

        alt: "Ankylosaurus",

        stats: [

            ["Diet", "Herbivore"],

            ["Length", "Around 8 m"],

            ["Defense", "Tail club"],

            ["Type", "Armored dinosaur"]

        ],

        fact:
        "Ankylosaurus was covered in bony armor and had a powerful tail club that could be used for defense."

    },


    allosaurus: {

        number: "SPECIES 08",

        name: "Allosaurus",

        period: "LATE JURASSIC",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/b/b0/Allosaurus_BW.jpg",

        alt: "Allosaurus",

        stats: [

            ["Diet", "Carnivore"],

            ["Length", "Around 9 m"],

            ["Feature", "Large jaws"],

            ["Type", "Theropod"]

        ],

        fact:
        "Allosaurus was a major predator of the Late Jurassic and had a large skull filled with sharp teeth."

    },


    diplodocus: {

        number: "SPECIES 09",

        name: "Diplodocus",

        period: "LATE JURASSIC",

        image:
        "https://upload.wikimedia.org/wikipedia/commons/5/5b/Diplodocus_carnegii.jpg",

        alt: "Diplodocus",

        stats: [

            ["Diet", "Herbivore"],

            ["Length", "Around 25 m"],

            ["Feature", "Whip-like tail"],

            ["Type", "Sauropod"]

        ],

        fact:
        "Diplodocus had an extremely long neck and tail. Its whip-like tail made up a large portion of its overall length."

    }

};


/* =====================================================
   GET DINOSAUR FROM URL
===================================================== */

const params = new URLSearchParams(window.location.search);

const dinoKey = params.get("dino");

const dino = dinosaurs[dinoKey];


/* =====================================================
   DISPLAY ONLY THE SELECTED DINOSAUR
===================================================== */

const container =
    document.getElementById("dinoContainer");


if (dino) {

    document.title =
        dino.name + " | Dino Explorer";


    document.getElementById("heroTitle").textContent =
        dino.name.toUpperCase();


    document.getElementById("heroSubtitle").textContent =
        "Enter the world of " + dino.name +
        " and discover its prehistoric story.";


    let statsHTML = "";


    dino.stats.forEach(stat => {

        statsHTML += `

            <div class="stat">

                <span class="stat-label">
                    ${stat[0]}
                </span>

                <span class="stat-value">
                    ${stat[1]}
                </span>

            </div>

        `;

    });


    container.innerHTML = `

        <article class="dino-profile">

            <img
                class="dino-photo"
                src="${dino.image}"
                alt="${dino.alt}"
            >

            <div class="dino-info">

                <div class="dino-number">
                    ${dino.number}
                </div>

                <h2>
                    ${dino.name}
                </h2>

                <div class="period">
                    ${dino.period}
                </div>

                <div class="stats">

                    ${statsHTML}

                </div>

                <div class="fact">

                    ${dino.fact}

                </div>

            </div>

        </article>

    `;

}


/* =====================================================
   INVALID DINOSAUR
===================================================== */

else {

    document.getElementById("heroTitle").textContent =
        "DINO NOT FOUND";

    document.getElementById("heroSubtitle").textContent =
        "Choose a dinosaur from the exploration page.";

    container.innerHTML = `

        <div class="error">

            <h2>
                🦖 Oops!
            </h2>

            <p>
                We couldn't find that dinosaur.
            </p>

            <a href="index.html">
                ← BACK TO DINOSAURS
            </a>

        </div>

    `;

}

</script>


</body>
</html>
