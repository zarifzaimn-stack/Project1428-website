<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dinosaur Archive | Dino Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #07110b;
    color: white;
    font-family: 'Montserrat', sans-serif;
}

/* NAV */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 78px;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    background: rgba(5,15,9,0.82);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(160,195,145,0.15);
}

.logo {
    color: #dcebd4;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
}

.back {
    color: #b8d1ad;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
}

.back:hover {
    color: white;
}

/* HERO */

.hero {
    min-height: 430px;
    padding: 140px 25px 70px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            #193522,
            #07110b 72%
        );
}

.hero-content {
    max-width: 850px;
}

.hero-small {
    color: #9fc78c;
    font-size: 12px;
    letter-spacing: 5px;
    font-weight: 600;
    margin-bottom: 20px;
}

.hero h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(48px, 8vw, 85px);
    margin: 0;
    line-height: 1;
    color: #e2eddd;
}

.hero p {
    max-width: 650px;
    margin: 25px auto 0;
    color: #91a393;
    line-height: 1.8;
}

/* ARCHIVE */

.archive {
    max-width: 1200px;
    margin: auto;
    padding: 70px 25px 110px;
}

/* ONE DINOSAUR CARD */

.dino-profile {
    display: grid;
    grid-template-columns: 1fr 1fr;

    width: 100%;
    min-height: 570px;

    overflow: hidden;

    background: #0d1911;

    border: 1px solid rgba(155,190,140,0.18);

    box-shadow: 0 25px 70px rgba(0,0,0,0.4);

    border-radius: 4px;
}

/* IMAGE AREA */

.dino-image-area {
    width: 100%;
    height: 570px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        radial-gradient(
            circle,
            #203b27 0%,
            #101f14 55%,
            #07110b 100%
        );
}

/* THE IMAGE */

.dino-photo {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    filter: drop-shadow(0 20px 25px rgba(0,0,0,0.55));
}

/* INFO */

.dino-info {
    padding: 55px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.dino-number {
    color: #8fb67e;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 12px;
}

.dino-info h2 {
    font-family: 'Cinzel', serif;
    font-size: clamp(32px, 4vw, 52px);
    line-height: 1.05;
    margin: 0 0 15px;
    color: #e1ebdd;
}

.period {
    color: #a5b5a0;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 30px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 30px;
}

.stat {
    padding: 16px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.07);
}

.stat-label {
    display: block;
    color: #71816f;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
}

.stat-value {
    color: #d7e5d2;
    font-size: 14px;
    font-weight: 600;
}

.fact {
    border-left: 2px solid #8fb67e;
    padding-left: 18px;
    color: #9cac99;
    font-size: 13px;
    line-height: 1.8;
}

/* ERROR */

.error {
    text-align: center;
    padding: 100px 20px;
}

.error h2 {
    font-family: 'Cinzel', serif;
    font-size: 45px;
    color: #dcebd4;
}

.error p {
    color: #91a393;
}

/* FALLING DINOS */

.falling-dino {
    position: fixed;
    top: -70px;

    font-size: 43px;

    z-index: 90;

    pointer-events: none;

    opacity: 0.4;

    animation: fall linear infinite;
}

@keyframes fall {

    from {
        transform:
            translateY(-80px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(360deg);
    }
}

/* FOOTER */

footer {
    padding: 35px;
    text-align: center;

    background: #040b06;

    color: #657664;

    font-size: 12px;
    letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 850px) {

    .dino-profile {
        grid-template-columns: 1fr;
    }

    .dino-image-area {
        height: 400px;
    }

    .dino-info {
        padding: 35px 25px;
    }

}

@media (max-width: 600px) {

    nav {
        height: 65px;
        padding: 0 20px;
    }

    .logo {
        font-size: 17px;
    }

    .back {
        font-size: 11px;
    }

    .hero {
        min-height: 400px;
    }

    .hero h1 {
        font-size: 45px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .dino-image-area {
        height: 330px;
        padding: 15px;
    }

}

</style>
</head>

<body>

<!-- FALLING DINOSAURS -->

<div class="falling-dino"
     style="left:1%; animation-duration:8s;">
    🦖
</div>

<div class="falling-dino"
     style="left:5%; animation-duration:11s; animation-delay:3s;">
    🦕
</div>

<div class="falling-dino"
     style="right:1%; animation-duration:9s; animation-delay:1s;">
    🦖
</div>

<div class="falling-dino"
     style="right:5%; animation-duration:12s; animation-delay:4s;">
    🦕
</div>


<!-- NAV -->

<nav>

    <a href="index.html" class="logo">
        🦖 DINO EXPLORER
    </a>

    <a href="index.html" class="back">
        ← BACK TO EXPLORE
    </a>

</nav>


<!-- HERO -->

<header class="hero">

    <div class="hero-content">

        <div class="hero-small">
            PREHISTORIC ARCHIVE
        </div>

        <h1 id="heroTitle">
            DINOSAUR
        </h1>

        <p id="heroDescription">
            Discover one of Earth's prehistoric giants.
        </p>

    </div>

</header>


<!-- DINOSAUR -->

<main class="archive">

    <div id="dinoContainer"></div>

</main>


<!-- FOOTER -->

<footer>

    🦖 DINO EXPLORER

    <br><br>

    THE PREHISTORIC WORLD AWAITS.

</footer>


<script>

/* =====================================================
   DINOSAUR DATABASE
===================================================== */

const dinosaurs = {

    trex: {
        name: "Tyrannosaurus Rex",
        number: "SPECIES 01",
        period: "LATE CRETACEOUS",
        image: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Tyrannosaurus_Rex_Holotype.jpg",
        alt: "Tyrannosaurus Rex",
        diet: "Carnivore",
        length: "Around 12 m",
        feature: "Powerful bite",
        type: "Theropod",
        fact: "T. rex was one of the most famous predators ever discovered. It had enormous jaws, powerful teeth, and a massive skull."
    },

    triceratops: {
        name: "Triceratops",
        number: "SPECIES 02",
        period: "LATE CRETACEOUS",
        image: "https://upload.wikimedia.org/wikipedia/commons/4/44/Triceratops_BW.jpg",
        alt: "Triceratops",
        diet: "Herbivore",
        length: "Around 9 m",
        feature: "Three horns",
        type: "Ceratopsian",
        fact: "Triceratops had a huge skull, a protective frill, and three distinctive horns."
    },

    velociraptor: {
        name: "Velociraptor",
        number: "SPECIES 03",
        period: "LATE CRETACEOUS",
        image: "https://upload.wikimedia.org/wikipedia/commons/5/5e/Velociraptor_restoration.png",
        alt: "Velociraptor",
        diet: "Carnivore",
        length: "Around 2 m",
        feature: "Curved claw",
        type: "Dromaeosaur",
        fact: "Real Velociraptors were much smaller than their movie versions. Fossil evidence indicates they had feathers."
    },

    spinosaurus: {
        name: "Spinosaurus",
        number: "SPECIES 04",
        period: "CRETACEOUS",
        image: "https://upload.wikimedia.org/wikipedia/commons/e/e5/Spinosaurus_aegyptiacus.png",
        alt: "Spinosaurus",
        diet: "Carnivore",
        length: "Around 15 m",
        feature: "Large sail",
        type: "Theropod",
        fact: "Spinosaurus had a long narrow skull and a distinctive sail-like structure along its back."
    },

    stegosaurus: {
        name: "Stegosaurus",
        number: "SPECIES 05",
        period: "LATE JURASSIC",
        image: "https://upload.wikimedia.org/wikipedia/commons/0/08/Stegosaurus_BW.jpg",
        alt: "Stegosaurus",
        diet: "Herbivore",
        length: "Around 9 m",
        feature: "Back plates",
        type: "Stegosaur",
        fact: "Stegosaurus had two rows of large plates along its back and four sharp spikes on its tail."
    },

    brachiosaurus: {
        name: "Brachiosaurus",
        number: "SPECIES 06",
        period: "LATE JURASSIC",
        image: "https://upload.wikimedia.org/wikipedia/commons/3/3b/Brachiosaurus_BW.jpg",
        alt: "Brachiosaurus",
        diet: "Herbivore",
        length: "Around 23 m",
        feature: "Long neck",
        type: "Sauropod",
        fact: "Brachiosaurus had extremely long front legs and a tall neck that helped it reach vegetation high above the ground."
    },

    ankylosaurus: {
        name: "Ankylosaurus",
        number: "SPECIES 07",
        period: "LATE CRETACEOUS",
        image: "https://upload.wikimedia.org/wikipedia/commons/5/5e/Ankylosaurus_dinosaur.png",
        alt: "Ankylosaurus",
        diet: "Herbivore",
        length: "Around 8 m",
        feature: "Tail club",
        type: "Ankylosaur",
        fact: "Ankylosaurus was protected by heavy armor and had a powerful club at the end of its tail."
    },

    allosaurus: {
        name: "Allosaurus",
        number: "SPECIES 08",
        period: "LATE JURASSIC",
        image: "https://upload.wikimedia.org/wikipedia/commons/b/b0/Allosaurus_BW.jpg",
        alt: "Allosaurus",
        diet: "Carnivore",
        length: "Around 9 m",
        feature: "Large claws",
        type: "Theropod",
        fact: "Allosaurus was a large Jurassic predator with strong jaws, sharp teeth, and powerful arms."
    },

    diplodocus: {
        name: "Diplodocus",
        number: "SPECIES 09",
        period: "LATE JURASSIC",
        image: "https://upload.wikimedia.org/wikipedia/commons/5/5b/Diplodocus_carnegii.jpg",
        alt: "Diplodocus",
        diet: "Herbivore",
        length: "Around 25 m",
        feature: "Whip-like tail",
        type: "Sauropod",
        fact: "Diplodocus had an extremely long neck and a long whip-like tail."
    }

};


/* =====================================================
   GET DINOSAUR FROM URL
===================================================== */

const params = new URLSearchParams(window.location.search);

const selectedDino = params.get("dino");


/* =====================================================
   DISPLAY ONLY THE SELECTED DINOSAUR
===================================================== */

const container = document.getElementById("dinoContainer");

const heroTitle = document.getElementById("heroTitle");

const heroDescription =
    document.getElementById("heroDescription");


if (selectedDino && dinosaurs[selectedDino]) {

    const dino = dinosaurs[selectedDino];

    /* Change page title */

    document.title =
        dino.name + " | Dino Explorer";


    /* Change hero */

    heroTitle.textContent =
        dino.name;

    heroDescription.textContent =
        "Explore the prehistoric world of " +
        dino.name + ".";


    /* Create ONLY ONE CARD */

    container.innerHTML = `

        <article class="dino-profile">

            <div class="dino-image-area">

                <img
                    class="dino-photo"
                    src="${dino.image}"
                    alt="${dino.alt}"
                    onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=&quot;color:#9fc78c;text-align:center;font-family:Cinzel,serif;font-size:22px;&quot;>Image unavailable</div>';"
                >

            </div>


            <div class="dino-info">

                <div class="dino-number">
                    ${dino.number}
                </div>

                <h2>
                    ${dino.name}
                </h2>

                <div class="period">
                    ${dino.period}
                </div>


                <div class="stats">

                    <div class="stat">

                        <span class="stat-label">
                            Diet
                        </span>

                        <span class="stat-value">
                            ${dino.diet}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="stat-label">
                            Length
                        </span>

                        <span class="stat-value">
                            ${dino.length}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="stat-label">
                            Feature
                        </span>

                        <span class="stat-value">
                            ${dino.feature}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="stat-label">
                            Type
                        </span>

                        <span class="stat-value">
                            ${dino.type}
                        </span>

                    </div>

                </div>


                <div class="fact">

                    ${dino.fact}

                </div>

            </div>

        </article>

    `;

} else {

    /* If someone opens dinosaurs.html
       without selecting a dinosaur */

    heroTitle.textContent =
        "NO DINOSAUR SELECTED";

    heroDescription.textContent =
        "Choose a dinosaur from the Explore page.";

    container.innerHTML = `

        <div class="error">

            <h2>
                🦖 Choose a Dinosaur
            </h2>

            <p>
                Go back to the Explore page and select
                a dinosaur to view its information.
            </p>

        </div>

    `;

}

</script>

</body>
</html>
