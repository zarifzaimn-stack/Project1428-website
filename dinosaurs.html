<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dinosaur Details 🦖</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    background: #f5f9f3;
    color: #173b2a;
}

/* NAVIGATION */

nav {
    background: #14532d;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: white;
    font-family: 'Fredoka', sans-serif;
    font-size: 25px;
    font-weight: 700;
    text-decoration: none;
}

.back {
    color: white;
    text-decoration: none;
    font-weight: 700;
    background: #2f855a;
    padding: 10px 18px;
    border-radius: 20px;
    transition: 0.3s;
}

.back:hover {
    background: #4caf70;
}

/* MAIN */

.container {
    max-width: 1000px;
    margin: auto;
    padding: 55px 25px;
}

/* DINO IMAGE */

.dino-image {
    width: 100%;
    max-height: 480px;
    object-fit: cover;
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(20, 83, 45, 0.2);
}

/* TITLE */

h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 55px;
    color: #14532d;
    margin: 30px 0 10px;
}

.period {
    color: #4b7f5b;
    font-weight: 700;
    font-size: 18px;
}

/* INFO */

.info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin: 35px 0;
}

.info-box {
    background: white;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 7px 20px rgba(20, 83, 45, 0.1);
}

.info-box h3 {
    margin: 0 0 8px;
    color: #4b7f5b;
    font-size: 15px;
}

.info-box p {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
}

/* FACT */

.fact {
    background: #e4f2e7;
    border-left: 6px solid #2f855a;
    padding: 25px;
    border-radius: 15px;
    margin-top: 20px;
}

.fact h2 {
    font-family: 'Fredoka', sans-serif;
    margin-top: 0;
    color: #14532d;
}

.fact p {
    line-height: 1.7;
    font-size: 17px;
}

/* FALLING DINOSAURS */

.falling-dino {
    position: fixed;
    top: -60px;
    font-size: 40px;
    pointer-events: none;
    z-index: 5;
    animation: fall linear infinite;
}

@keyframes fall {

    from {
        transform: translateY(-80px) rotate(0deg);
    }

    to {
        transform: translateY(110vh) rotate(360deg);
    }

}

/* FOOTER */

footer {
    background: #123b27;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 30px;
}

/* MOBILE */

@media (max-width: 700px) {

    h1 {
        font-size: 40px;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<!-- Falling dinosaurs -->

<div class="falling-dino" style="left: 3%; animation-duration: 7s;">
🦖
</div>

<div class="falling-dino" style="left: 8%; animation-duration: 9s; animation-delay: 3s;">
🦕
</div>

<div class="falling-dino" style="right: 3%; animation-duration: 8s; animation-delay: 1s;">
🦖
</div>

<div class="falling-dino" style="right: 8%; animation-duration: 10s; animation-delay: 4s;">
🦕
</div>


<!-- NAVIGATION -->

<nav>

    <a href="index.html" class="logo">
        🦖 Dino Explorer
    </a>

    <a href="index.html" class="back">
        ← Back
    </a>

</nav>


<!-- MAIN CONTENT -->

<main class="container">

    <img id="dinoImage" class="dino-image" src="" alt="Dinosaur">

    <h1 id="dinoName">Dinosaur</h1>

    <p id="dinoPeriod" class="period"></p>


    <div class="info-grid">

        <div class="info-box">
            <h3>🍖 DIET</h3>
            <p id="dinoDiet"></p>
        </div>

        <div class="info-box">
            <h3>📏 LENGTH</h3>
            <p id="dinoLength"></p>
        </div>

        <div class="info-box">
            <h3>🌍 LIVED</h3>
            <p id="dinoLocation"></p>
        </div>

    </div>


    <div class="fact">

        <h2>💡 Amazing Fact</h2>

        <p id="dinoFact"></p>

    </div>

</main>


<footer>
    🦖 Dino Explorer | Explore. Learn. Discover.
</footer>


<script>

/* DINOSAUR DATABASE */

const dinos = {

    trex: {
        name: "Tyrannosaurus Rex",
        image: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Tyrannosaurus_Rex_Holotype.jpg",
        period: "Late Cretaceous • About 68–66 million years ago",
        diet: "Carnivore 🥩",
        length: "About 12 meters",
        location: "North America",
        fact: "Tyrannosaurus Rex was one of the most famous predators of all time. It had huge teeth and powerful jaws designed for biting through tough food."
    },

    triceratops: {
        name: "Triceratops",
        image: "https://upload.wikimedia.org/wikipedia/commons/4/44/Triceratops_BW.jpg",
        period: "Late Cretaceous • About 68–66 million years ago",
        diet: "Herbivore 🌿",
        length: "About 9 meters",
        location: "North America",
        fact: "Triceratops had three horns and a large bony frill. Its horns may have helped it defend itself and communicate with other Triceratops."
    },

    velociraptor: {
        name: "Velociraptor",
        image: "https://upload.wikimedia.org/wikipedia/commons/5/5e/Velociraptor_restoration.png",
        period: "Late Cretaceous • About 75–71 million years ago",
        diet: "Carnivore 🥩",
        length: "About 2 meters",
        location: "Central Asia",
        fact: "Real Velociraptors were much smaller than the dinosaurs shown in many movies. Evidence also suggests they had feathers."
    },

    spinosaurus: {
        name: "Spinosaurus",
        image: "https://upload.wikimedia.org/wikipedia/commons/e/e5/Spinosaurus_aegyptiacus.png",
        period: "Cretaceous • About 100–94 million years ago",
        diet: "Carnivore 🥩",
        length: "Around 14 meters",
        location: "North Africa",
        fact: "Spinosaurus had a long, narrow snout and a huge sail-like structure on its back. It was adapted for life around water."
    },

    stegosaurus: {
        name: "Stegosaurus",
        image: "https://upload.wikimedia.org/wikipedia/commons/0/08/Stegosaurus_BW.jpg",
        period: "Late Jurassic • About 155–150 million years ago",
        diet: "Herbivore 🌿",
        length: "About 9 meters",
        location: "North America & Europe",
        fact: "Stegosaurus had large plates along its back and four sharp spikes at the end of its tail."
    },

    brachiosaurus: {
        name: "Brachiosaurus",
        image: "https://upload.wikimedia.org/wikipedia/commons/3/3b/Brachiosaurus_BW.jpg",
        period: "Late Jurassic • About 154–150 million years ago",
        diet: "Herbivore 🌿",
        length: "Around 23 meters",
        location: "North America",
        fact: "Brachiosaurus had extremely long front legs, giving it a tall, giraffe-like appearance."
    },

    ankylosaurus: {
        name: "Ankylosaurus",
        image: "https://upload.wikimedia.org/wikipedia/commons/5/5e/Ankylosaurus_dinosaur.png",
        period: "Late Cretaceous • About 68–66 million years ago",
        diet: "Herbivore 🌿",
        length: "About 8 meters",
        location: "North America",
        fact: "Ankylosaurus was covered in protective bony armor and had a powerful club at the end of its tail."
    },

    allosaurus: {
        name: "Allosaurus",
        image: "https://upload.wikimedia.org/wikipedia/commons/b/b0/Allosaurus_BW.jpg",
        period: "Late Jurassic • About 155–145 million years ago",
        diet: "Carnivore 🥩",
        length: "About 9 meters",
        location: "North America & Europe",
        fact: "Allosaurus was a large predator that lived millions of years before Tyrannosaurus Rex."
    },

    diplodocus: {
        name: "Diplodocus",
        image: "https://upload.wikimedia.org/wikipedia/commons/5/5b/Diplodocus_carnegii.jpg",
        period: "Late Jurassic • About 154–152 million years ago",
        diet: "Herbivore 🌿",
        length: "Around 25 meters",
        location: "North America",
        fact: "Diplodocus had an incredibly long neck and tail. Its tail may have helped it balance its huge body."
    },

    parasaurolophus: {
        name: "Parasaurolophus",
        image: "https://upload.wikimedia.org/wikipedia/commons/7/73/Parasaurolophus_cyrtocristatus.jpg",
        period: "Late Cretaceous • About 76–73 million years ago",
        diet: "Herbivore 🌿",
        length: "About 10 meters",
        location: "North America",
        fact: "Parasaurolophus had a long hollow crest extending backward from its skull. Scientists think it may have helped produce sounds."
    }

};


/* GET THE DINOSAUR FROM THE URL */

const params = new URLSearchParams(window.location.search);

const selectedDino = params.get("dino");


/* SHOW DINOSAUR */

if (dinos[selectedDino]) {

    const dino = dinos[selectedDino];

    document.getElementById("dinoImage").src = dino.image;

    document.getElementById("dinoImage").alt = dino.name;

    document.getElementById("dinoName").textContent = dino.name;

    document.getElementById("dinoPeriod").textContent = dino.period;

    document.getElementById("dinoDiet").textContent = dino.diet;

    document.getElementById("dinoLength").textContent = dino.length;

    document.getElementById("dinoLocation").textContent = dino.location;

    document.getElementById("dinoFact").textContent = dino.fact;

}

else {

    document.getElementById("dinoName").textContent = "Dinosaur Not Found";

    document.getElementById("dinoPeriod").textContent =
        "Please return to the dinosaur list and choose a dinosaur.";

}

</script>

</body>
</html>
