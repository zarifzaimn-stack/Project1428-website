<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dino Archive | Dino Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07110b;
    color: white;
    font-family: 'Montserrat', sans-serif;
}

/* NAV */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 78px;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    background: rgba(5,15,9,0.85);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(160,195,145,0.15);
}

.logo {
    color: #dcebd4;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
}

.back {
    color: #b8d1ad;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
}

.back:hover {
    color: white;
}

/* MAIN */

main {
    min-height: 100vh;
    padding: 130px 5% 80px;
}

.profile {
    max-width: 1200px;
    min-height: 650px;
    margin: auto;

    display: grid;
    grid-template-columns: 1fr 1fr;

    background: #0d1911;

    border: 1px solid rgba(155,190,140,0.18);

    box-shadow: 0 25px 80px rgba(0,0,0,0.4);

    overflow: hidden;
}

/* IMAGE */

.image-area {
    width: 100%;
    height: 650px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            #203c28 0%,
            #0b1710 70%
        );

    padding: 35px;
}

.dino-image {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
}

/* INFO */

.info {
    padding: 60px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.number {
    color: #8fb67e;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 15px;
}

h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(40px, 5vw, 65px);
    line-height: 1.05;
    margin: 0 0 15px;
    color: #e1ebdd;
}

.period {
    color: #9faf9a;
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 35px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 30px;
}

.stat {
    padding: 18px;

    background: rgba(255,255,255,0.035);

    border: 1px solid rgba(255,255,255,0.07);
}

.label {
    display: block;

    color: #71816f;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-bottom: 7px;
}

.value {
    color: #d7e5d2;
    font-size: 14px;
    font-weight: 600;
}

/* FACT */

.fact {
    border-left: 2px solid #8fb67e;

    padding-left: 18px;

    color: #9cac99;

    font-size: 14px;

    line-height: 1.8;
}

/* ERROR */

.error {
    text-align: center;
    max-width: 700px;
    margin: 150px auto;
}

.error h1 {
    font-size: 45px;
}

.error a {
    color: #a7cf8e;
}

/* FALLING DINOS */

.falling-dino {
    position: fixed;
    top: -70px;

    font-size: 42px;

    pointer-events: none;

    z-index: 90;

    opacity: 0.35;

    animation: fall linear infinite;
}

@keyframes fall {

    from {
        transform: translateY(-80px) rotate(0deg);
    }

    to {
        transform: translateY(110vh) rotate(360deg);
    }

}

/* MOBILE */

@media(max-width: 850px) {

    .profile {
        grid-template-columns: 1fr;
    }

    .image-area {
        height: 450px;
    }

    .info {
        padding: 40px 25px;
    }

}

@media(max-width: 600px) {

    nav {
        height: 65px;
        padding: 0 20px;
    }

    .logo {
        font-size: 17px;
    }

    .back {
        font-size: 11px;
    }

    main {
        padding: 100px 15px 50px;
    }

    .image-area {
        height: 350px;
        padding: 20px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<!-- FALLING DINOS -->

<div class="falling-dino" style="left:2%;animation-duration:8s;">🦖</div>
<div class="falling-dino" style="left:6%;animation-duration:11s;animation-delay:3s;">🦕</div>
<div class="falling-dino" style="right:2%;animation-duration:9s;animation-delay:1s;">🦖</div>
<div class="falling-dino" style="right:6%;animation-duration:12s;animation-delay:4s;">🦕</div>

<!-- NAV -->

<nav>

<a href="index.html" class="logo">
🦖 DINO EXPLORER
</a>

<a href="index.html" class="back">
← BACK TO EXPLORE
</a>

</nav>

<main>

<div id="profile"></div>

</main>

<script>

/*
=================================================
DINO DATABASE
THE IMAGE URLS ARE THE SAME ONES FROM INDEX.HTML
=================================================
*/

const dinos = {

    trex: {
        number: "SPECIES 01",
        name: "Tyrannosaurus Rex",
        period: "LATE CRETACEOUS",
        image: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Tyrannosaurus_Rex_Holotype.jpg",
        diet: "Carnivore",
        length: "Around 12 m",
        feature: "Powerful bite",
        type: "Theropod",
        fact: "T. rex was one of the largest meat-eating dinosaurs and had enormous jaws filled with powerful teeth."
    },

    triceratops: {
        number: "SPECIES 02",
        name: "Triceratops",
        period: "LATE CRETACEOUS",
        image: "https://upload.wikimedia.org/wikipedia/commons/4/44/Triceratops_BW.jpg",
        diet: "Herbivore",
        length: "Around 9 m",
        feature: "Three horns",
        type: "Ceratopsian",
        fact: "Triceratops had three horns and a huge protective frill at the back of its skull."
    },

    velociraptor: {
        number: "SPECIES 03",
        name: "Velociraptor",
        period: "LATE CRETACEOUS",
        image: "https://upload.wikimedia.org/wikipedia/commons/5/5e/Velociraptor_restoration.png",
        diet: "Carnivore",
        length: "Around 2 m",
        feature: "Curved claw",
        type: "Dromaeosaur",
        fact: "Real Velociraptors were much smaller than their movie versions, and fossil evidence shows they had feathers."
    },

    spinosaurus: {
        number: "SPECIES 04",
        name: "Spinosaurus",
        period: "CRETACEOUS",
        image: "https://upload.wikimedia.org/wikipedia/commons/e/e5/Spinosaurus_aegyptiacus.png",
        diet: "Carnivore",
        length: "Around 14–18 m",
        feature: "Large sail",
        type: "Theropod",
        fact: "Spinosaurus had a long narrow skull and a distinctive sail-like structure along its back."
    },

    stegosaurus: {
        number: "SPECIES 05",
        name: "Stegosaurus",
        period: "LATE JURASSIC",
        image: "https://upload.wikimedia.org/wikipedia/commons/0/08/Stegosaurus_BW.jpg",
        diet: "Herbivore",
        length: "Around 9 m",
        feature: "Back plates",
        type: "Thyreophoran",
        fact: "Stegosaurus had large plates along its back and four long spikes on its tail."
    },

    brachiosaurus: {
        number: "SPECIES 06",
        name: "Brachiosaurus",
        period: "LATE JURASSIC",
        image: "https://upload.wikimedia.org/wikipedia/commons/3/3b/Brachiosaurus_BW.jpg",
        diet: "Herbivore",
        length: "Around 23 m",
        feature: "Long neck",
        type: "Sauropod",
        fact: "Brachiosaurus had a very long neck that helped it reach vegetation high above the ground."
    },

    ankylosaurus: {
        number: "SPECIES 07",
        name: "Ankylosaurus",
        period: "LATE CRETACEOUS",
        image: "https://upload.wikimedia.org/wikipedia/commons/5/5e/Ankylosaurus_dinosaur.png",
        diet: "Herbivore",
        length: "Around 8 m",
        feature: "Tail club",
        type: "Ankylosaur",
        fact: "Ankylosaurus was covered in heavy armor and had a powerful club at the end of its tail."
    },

    allosaurus: {
        number: "SPECIES 08",
        name: "Allosaurus",
        period: "LATE JURASSIC",
        image: "https://upload.wikimedia.org/wikipedia/commons/b/b0/Allosaurus_BW.jpg",
        diet: "Carnivore",
        length: "Around 9–10 m",
        feature: "Sharp teeth",
        type: "Theropod",
        fact: "Allosaurus was a large Jurassic predator with powerful jaws and many sharp teeth."
    },

    diplodocus: {
        number: "SPECIES 09",
        name: "Diplodocus",
        period: "LATE JURASSIC",
        image: "https://upload.wikimedia.org/wikipedia/commons/5/5b/Diplodocus_carnegii.jpg",
        diet: "Herbivore",
        length: "Around 25–30 m",
        feature: "Whip-like tail",
        type: "Sauropod",
        fact: "Diplodocus had an extremely long neck and a long whip-like tail."
    }

};


/*
=================================================
GET THE DINOSAUR FROM THE URL
=================================================
*/

const params = new URLSearchParams(window.location.search);

const selectedDino = params.get("dino");

const profile = document.getElementById("profile");

const dino = dinos[selectedDino];


/*
=================================================
SHOW ONLY THE SELECTED DINOSAUR
=================================================
*/

if (!dino) {

    profile.innerHTML = `
    
        <div class="error">

            <h1>
                Dinosaur Not Found 🦖
            </h1>

            <p>
                Please go back and choose a dinosaur.
            </p>

            <a href="index.html">
                ← Return to Dino Explorer
            </a>

        </div>

    `;

} else {

    profile.innerHTML = `

        <article class="profile">

            <div class="image-area">

                <img
                    class="dino-image"
                    src="${dino.image}"
                    alt="${dino.name}"
                    onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=&quot;color:#9fc78c;text-align:center;font-size:18px;&quot;>Image unavailable</div>';"
                >

            </div>


            <div class="info">

                <div class="number">
                    ${dino.number}
                </div>

                <h1>
                    ${dino.name}
                </h1>

                <div class="period">
                    ${dino.period}
                </div>


                <div class="stats">

                    <div class="stat">

                        <span class="label">
                            DIET
                        </span>

                        <span class="value">
                            ${dino.diet}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="label">
                            LENGTH
                        </span>

                        <span class="value">
                            ${dino.length}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="label">
                            FEATURE
                        </span>

                        <span class="value">
                            ${dino.feature}
                        </span>

                    </div>


                    <div class="stat">

                        <span class="label">
                            TYPE
                        </span>

                        <span class="value">
                            ${dino.type}
                        </span>

                    </div>

                </div>


                <div class="fact">

                    ${dino.fact}

                </div>

            </div>

        </article>

    `;

}

</script>

</body>
</html>
